name: CI
# MANUAL-ONLY: push/pull_request auto-triggers were removed so routine commits (incl. the autosync
# job) no longer burn GitHub Actions minutes — the same gates (mypy/ruff/pytest) run locally before
# every push. Run this from the Actions tab (Run workflow) if you ever want a clean hosted check.
on:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for offscreen Qt / QtWebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxi6 libxtst6 \
            libxrender1 libfontconfig1 fonts-dejavu-core || true

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync

      - name: mypy --strict
        run: uv run mypy --strict src/

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: pytest (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
