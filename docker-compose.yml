# Convenience wrapper for the headless CLI. Run any nabu-cli command with:
#   docker compose run --rm nabu doctor
#   docker compose run --rm nabu scan 10.10.10.5 -p box
# For the desktop GUI use the helper script instead (it wires X11): docker/nabu-docker.sh gui
services:
  nabu:
    build:
      context: .
      args:
        WITH_WORDLISTS: "1"
    image: ${NABU_IMAGE:-nabu:latest}
    # host networking so a VPN tun + raw-socket nmap work (Linux hosts).
    network_mode: host
    cap_add:
      - NET_RAW   # all nmap needs for SYN/UDP scans; nmap has cap_net_raw+ep in the image
    volumes:
      # persistent workspace (scans / creds / notes / config). SAME default as docker/nabu-docker.sh
      # so both entry points share one workspace. :z is a no-op off SELinux, required on Fedora/RHEL.
      - ${NABU_DATA:-${HOME}/.nabu}:/data:z
    stdin_open: true
    tty: true
    # default action for a bare `docker compose run nabu`; override by appending a command.
    command: ["doctor"]
