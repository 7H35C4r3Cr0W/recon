[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oscp-recon"
version = "0.0.1"
description = "PySide6 desktop GUI recon orchestrator for OSCP prep and exam day (recon-only, exam-legal)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyside6>=6.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
oscprecon-cli = "oscprecon.cli:app"
oscprecon = "oscprecon.gui.app:main"
oscp-recon = "oscprecon.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "mypy>=1.10",
    "ruff",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oscprecon"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# why: Typer's public API requires calling Option()/Argument() in parameter defaults.
"src/oscprecon/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
