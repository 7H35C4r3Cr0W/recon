# Alembic config for Nabu Agent. Migrations live in nabu_agent/db/migrations.
[alembic]
script_location = nabu_agent/db/migrations
prepend_sys_path = .
# sqlalchemy.url is supplied at runtime from Settings.database_url (see env.py); this is a
# placeholder so `alembic` can start without a hardcoded secret.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
