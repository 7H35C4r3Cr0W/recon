# nginx edge: serve the SPA, proxy REST + WebSocket to the api service. HSTS + security headers.
server {
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/tls/server.crt;   # internal CA, mounted at deploy time
  ssl_certificate_key /etc/nginx/tls/server.key;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  client_max_body_size 8m;

  location /api/ { proxy_pass http://api:8000/; proxy_set_header Host $host;
                   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                   proxy_set_header X-Forwarded-Proto $scheme; }
  location /ws/  { proxy_pass http://api:8000/ws/; proxy_http_version 1.1;
                   proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
                   proxy_read_timeout 3600s; }
  location /     { root /usr/share/nginx/html; try_files $uri /index.html; }
}
