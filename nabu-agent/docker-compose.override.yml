# Local development overrides (docker compose automatically merges this file).
# - hot-reload the api on code changes
# - expose ports directly for convenience (prod binds api to loopback + fronts with nginx only)
services:
  api:
    command: ["uvicorn", "nabu_agent.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./nabu_agent:/src/nabu-agent/nabu_agent:ro   # live code (read-only mount)
    environment:
      NABU_ENV: development
  worker:
    volumes:
      - ./nabu_agent:/src/nabu-agent/nabu_agent:ro
    environment:
      NABU_ENV: development
  frontend:
    ports:
      - "127.0.0.1:8443:8443"
