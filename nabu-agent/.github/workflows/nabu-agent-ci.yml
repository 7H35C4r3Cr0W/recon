name: nabu-agent CI
# Scoped to the agent project: triggers only on changes under nabu-agent/ (or the engine it depends
# on). The classic engine has its own workflow; this one NEVER edits or re-tests src/oscprecon
# beyond importing it. Manual + PR-gated.
on:
  workflow_dispatch:
  pull_request:
    paths: ["nabu-agent/**", "src/oscprecon/**", "pyproject.toml"]

defaults:
  run:
    working-directory: nabu-agent

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync (agent + engine path dep)
        run: uv sync
      - name: ruff
        run: uv run ruff check
      - name: mypy
        run: uv run mypy nabu_agent
      - name: unit tests (engine mocked)
        run: uv run pytest -q -m "not invariant"

  # SEPARATE, must-pass gate. If any safety invariant regresses this job fails independently of the
  # unit suite, so a bypass can never ride in green behind unrelated test noise.
  policy-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync
      - name: policy-invariant suite
        run: uv run pytest -q -m invariant

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # REPO-HYGIENE GUARANTEE: this job fails if a PR under nabu-agent/ also touches src/oscprecon.
      # The engine is a read-only dependency; edits to it must come through the engine's own project.
      - name: assert src/oscprecon untouched by agent PRs
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ] && git diff --name-only "$base"...HEAD | grep -q '^src/oscprecon/'; then
            echo "::error::nabu-agent changes must not modify src/oscprecon (read-only engine dep)"
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: install SPA deps
        working-directory: nabu-agent/frontend
        run: npm install --no-audit --no-fund
      - name: frontend component tests
        working-directory: nabu-agent/frontend
        run: npm test
      - name: build SPA
        working-directory: nabu-agent/frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose config
        working-directory: nabu-agent
        run: docker compose config >/dev/null
      # A full image build (Kali base + toolset) is heavy; gate it behind a label in Phase 4.
