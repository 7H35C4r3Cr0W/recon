<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Self-contained animated preview of the Nabu Agent live run map. Replays the same demo
     choreography the backend executor emits (run.status/task.created/task.updated/log.line/
     finding.added) so you can SEE the agents in motion + colour-coded node states with no server.
     No external dependencies — hand-drawn SVG so it renders offline anywhere. -->
<title>Nabu Agent — Live Run Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --queued:#8394a0; --active:#2f9e57; --active-glow:#35d0ba; --stuck:#f0b429; --error:#f07a7a; --done:#4fb6f0;
    --bg:#0c1116; --panel:#131b22; --panel2:#0e141a; --line:#233039; --ink:#e7eef2; --ink2:#b7c4cc; --muted:#8394a0;
    --mono:"JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header b{font-family:var(--mono)} header .sub{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:14px;margin-left:auto;font-family:var(--mono);font-size:12px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px} .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .btn{font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{border-color:var(--active-glow);color:var(--active-glow)}
  .wrap{display:grid;grid-template-columns:1fr 360px;gap:10px;padding:10px;height:calc(100% - 54px)}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;height:auto}}
  .map{background:var(--panel2);border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;min-height:420px}
  .log{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-y:auto;font-family:var(--mono);font-size:12px;line-height:1.7;min-height:420px}
  .log .t{color:var(--muted);margin-bottom:6px} .log div.l{color:var(--ink2)}
  .status{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line)}
  text{font-family:var(--mono);fill:var(--ink2);font-size:11px}
  .node circle,.node rect,.node polygon{transition:fill .35s ease, opacity .35s ease, stroke .35s ease; stroke:#0e141a; stroke-width:2}
  .node.dim{opacity:.18}
  .node.active circle,.node.active rect,.node.active polygon{stroke:var(--active-glow);stroke-width:3.5;filter:url(#glow);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
  edge,.edge{stroke:var(--line);stroke-width:1.6;fill:none}
  .edge.hot{stroke:var(--active);stroke-width:2.4}
</style>
</head>
<body>
<header>
  <b>NABU · AGENT</b><span class="sub">live run map — preview (replays the demo choreography)</span>
  <span class="status" id="status">idle</span>
  <button class="btn" id="replay">▸ replay</button>
  <div class="legend">
    <span><i class="dot" style="background:var(--active)"></i>active</span>
    <span><i class="dot" style="background:var(--done)"></i>done</span>
    <span><i class="dot" style="background:var(--stuck)"></i>stuck</span>
    <span><i class="dot" style="background:var(--error)"></i>error</span>
    <span><i class="dot" style="background:var(--queued)"></i>queued</span>
  </div>
</header>
<div class="wrap">
  <div class="map">
    <svg id="svg" viewBox="0 0 920 540" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
  </div>
  <div class="log" id="log"><div class="t">live action log</div></div>
</div>

<script>
const C = { queued:"#8394a0", active:"#2f9e57", stuck:"#f0b429", error:"#f07a7a", done:"#4fb6f0" };

// node layout (mirrors orchestration/runmap.py: run → host → services → agents → findings → report)
const NODES = {
  "run":       {x:460,y:40,  shape:"rect", label:"recon run"},
  "host":      {x:460,y:120, shape:"hex",  label:"10.10.10.5"},
  "svc22":     {x:170,y:225, shape:"rrect",label:"22/ssh"},
  "svc80":     {x:460,y:225, shape:"rrect",label:"80/http"},
  "svc445":    {x:750,y:225, shape:"rrect",label:"445/smb"},
  "a22":       {x:170,y:330, shape:"circle",label:"enum ssh"},
  "a80":       {x:460,y:330, shape:"circle",label:"enum http"},
  "a445":      {x:750,y:330, shape:"circle",label:"enum smb"},
  "f80":       {x:460,y:435, shape:"diamond",label:"http title"},
  "f445":      {x:750,y:435, shape:"diamond",label:"SMB signing"},
  "report":    {x:460,y:500, shape:"star", label:"report"},
};
const EDGES = [["run","host"],["host","svc22"],["host","svc80"],["host","svc445"],
  ["svc22","a22"],["svc80","a80"],["svc445","a445"],["svc80","f80"],["svc445","f445"],["run","report"]];

const svgNS="http://www.w3.org/2000/svg";
const nodesG=document.getElementById("nodes"), edgesG=document.getElementById("edges"), logEl=document.getElementById("log"), statusEl=document.getElementById("status");

function shapeEl(n){
  const {x,y,shape}=n; let e;
  if(shape==="circle"){e=document.createElementNS(svgNS,"circle");e.setAttribute("cx",x);e.setAttribute("cy",y);e.setAttribute("r",18);}
  else if(shape==="hex"||shape==="diamond"||shape==="star"){e=document.createElementNS(svgNS,"polygon");e.setAttribute("points",poly(x,y,shape));}
  else{e=document.createElementNS(svgNS,shape==="rrect"||shape==="rect"?"rect":"rect");e.setAttribute("x",x-26);e.setAttribute("y",y-15);e.setAttribute("width",52);e.setAttribute("height",30);if(shape==="rrect"){e.setAttribute("rx",8);}}
  return e;
}
function poly(x,y,shape){
  if(shape==="diamond")return `${x},${y-16} ${x+16},${y} ${x},${y+16} ${x-16},${y}`;
  if(shape==="hex")return `${x-20},${y} ${x-10},${y-18} ${x+10},${y-18} ${x+20},${y} ${x+10},${y+18} ${x-10},${y+18}`;
  // star
  let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i - Math.PI/2;const r=i%2?8:18;p.push(`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`);}return p.join(" ");
}
const shapes={};
function build(){
  edgesG.innerHTML="";nodesG.innerHTML="";
  for(const [s,t] of EDGES){const a=NODES[s],b=NODES[t];const p=document.createElementNS(svgNS,"line");
    p.setAttribute("x1",a.x);p.setAttribute("y1",a.y+18);p.setAttribute("x2",b.x);p.setAttribute("y2",b.y-18);
    p.setAttribute("class","edge");p.dataset.k=`${s}->${t}`;edgesG.appendChild(p);}
  for(const [id,n] of Object.entries(NODES)){
    const g=document.createElementNS(svgNS,"g");g.setAttribute("class","node dim");g.dataset.id=id;
    const sh=shapeEl(n);sh.setAttribute("fill",C.queued);g.appendChild(sh);shapes[id]=sh;
    const tx=document.createElementNS(svgNS,"text");tx.setAttribute("x",n.x);tx.setAttribute("y",n.y+ (n.shape==="circle"?34:32));tx.setAttribute("text-anchor","middle");tx.textContent=n.label;g.appendChild(tx);
    nodesG.appendChild(g);
  }
}
function setState(id,state){
  const g=nodesG.querySelector(`g[data-id="${id}"]`);if(!g)return;
  g.classList.remove("dim");g.classList.toggle("active",state==="active");
  shapes[id].setAttribute("fill",C[state]||C.queued);
}
function log(line){const d=document.createElement("div");d.className="l";d.textContent=line;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}

// choreography — [delayMs, fn]. Mirrors nabu_agent/orchestration/executor.run_demo + shows stuck+error.
const SCRIPT=[
  [0,   ()=>{statusEl.textContent="scanning";setState("run","active");log("[scan] staged nmap against 10.10.10.5");}],
  [500, ()=>{setState("host","active");}],
  [500, ()=>{setState("svc22","done");log("[scan] 22/tcp open — OpenSSH 8.9");}],
  [350, ()=>{setState("svc80","done");log("[scan] 80/tcp open — nginx 1.18");}],
  [350, ()=>{setState("svc445","done");log("[scan] 445/tcp open — Samba 4.15");}],
  [400, ()=>{setState("host","done");setState("a22","queued");setState("a80","queued");setState("a445","queued");log("[fan-out] 3 enum agents queued");}],
  [500, ()=>{setState("a22","active");log("[enum] ssh :22 — Tier-1 recon");}],
  [800, ()=>{setState("a22","done");setState("a80","active");log("[enum] http :80 — Tier-1 recon");}],
  [800, ()=>{setState("f80","done");log("[finding] Apache default page");setState("a80","done");}],
  [400, ()=>{setState("a445","stuck");log("[enum] smb :445 — anonymous session blocked (needs a credential) → stuck");}],
  [900, ()=>{setState("a445","active");log("[enum] smb :445 — retrying with guest null session");}],
  [800, ()=>{setState("f445","error");log("[finding] SMB signing not required (exposure) → flagged");setState("a445","done");}],
  [500, ()=>{setState("report","active");log("[report] synthesizing findings + next steps");}],
  [900, ()=>{setState("report","done");setState("run","done");statusEl.textContent="done";log("[done] report ready — 3 services, 2 findings");}],
];
let timers=[];
function play(){
  timers.forEach(clearTimeout);timers=[];logEl.querySelectorAll(".l").forEach(e=>e.remove());
  build();let t=0;
  for(const [d,fn] of SCRIPT){t+=d;timers.push(setTimeout(fn,t));}
}
document.getElementById("replay").addEventListener("click",play);
build();play();
</script>
</body>
</html>
