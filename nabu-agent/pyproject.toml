# Nabu Agent — agentic web platform built on the classic Nabu (oscprecon) recon engine.
# The engine is a READ-ONLY path dependency; this project never modifies src/oscprecon.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nabu-agent"
version = "0.1.0"
description = "Nabu Agent — agent-driven recon platform wrapping the oscprecon engine as agent tools."
requires-python = ">=3.11"
authors = [{ name = "Lagus" }]
license = { text = "MIT" }

dependencies = [
    # The classic engine, imported as a library (path dependency to the SIBLING repo root).
    # NOTE: the engine's own pyproject declares pyside6 as a hard dep. The container installs the
    # engine WITHOUT Qt (see deploy/Dockerfile.api) and imports only Qt-free engine modules — a
    # policy-invariant test asserts PySide6 is never loaded. Never import oscprecon.gui.*.
    "oscp-recon",

    # Web platform
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "itsdangerous>=2.2",

    # Auth
    "authlib>=1.3",
    "argon2-cffi>=23",
    "pyjwt>=2.8",

    # Data stores
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",   # sync driver for Alembic migrations
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",

    # Brain seam (OpenAI-compatible; no vendor SDK)
    "httpx[http2]>=0.27",
    "tenacity>=8.3",
    "jinja2>=3.1",

    # Observability
    "structlog>=24.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]   # optional local token counting; degrades to a heuristic if absent

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff",
]

[tool.uv.sources]
# Consume the engine from the sibling repo root, NON-editable + read-only to us.
oscp-recon = { path = "..", editable = false }

[tool.hatch.build.targets.wheel]
packages = ["nabu_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "invariant: safety/policy invariants — a separate REQUIRED CI gate (pytest -m invariant)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["nabu_agent", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's public API requires calling Depends()/Query() in parameter defaults (same carve-out the
# engine's pyproject makes for Typer's Option()/Argument()). This is idiomatic, not a bug.
"nabu_agent/routers/*.py" = ["B008"]
"nabu_agent/auth/deps.py" = ["B008"]
"nabu_agent/routers/health.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["nabu_agent"]
ignore_missing_imports = true
