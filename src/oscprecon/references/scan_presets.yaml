# ---- Host discovery -------------------------------------------------------------------------------
- category: "Host discovery"
  description: "ARP ping sweep (same L2 / local /24)"
  why: "ARP host discovery (-PR) is the most reliable on a local subnet — nothing hides from ARP. Edit {target} to a /24."
  command: "nmap -sn -PR -n {target}"

# ---- Full TCP -------------------------------------------------------------------------------------
- category: "Full TCP"
  description: "Deep — full TCP, versioned, default + vuln NSE (very slow)"
  why: "Everything on every port: versions, default scripts AND the vuln category. Thorough; leave it running."
  command: "nmap -p- -sV -sC --script vuln -T4 {target}"
