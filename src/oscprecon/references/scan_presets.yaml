# Nmap scan presets (§8, §2-allowed) surfaced under Scan -> Nmap presets and the "More scan
# options…" chooser, GROUPED BY `category` so you can pick the right kind of scan for the situation
# (and see more of the same kind together). Each pre-fills the command builder with {target} filled
# from the active profile. Recon-only, exam-legal: plain nmap, no brute (`--script *brute*`), no
# spoofing (no -D decoy / -S spoofed-source / --spoof-mac). The `why` line is the note shown when you
# highlight the scan.

# =================================================================================================
# Fast / triage — confirm it's alive and get a first look quickly
# =================================================================================================
- category: "Fast / triage"
  description: "Quick triage — top 100 ports"
  why: "Fastest possible first look — the 100 most common ports. Confirm it's alive, then go deeper."
  command: "nmap --top-ports 100 -T4 {target}"

- category: "Fast / triage"
  description: "Fast scan (-F, top 100) + versions"
  why: "The -F shortcut (100 common ports) with service versions — a quick 'what's here' in one pass."
  command: "nmap -F -sV -T4 {target}"

- category: "Fast / triage"
  description: "Common ports, versioned (one fast pass)"
  why: "Top-1000 ports WITH service versions in a single fast pass — good default when time is short."
  command: "nmap -sV --top-ports 1000 -T4 {target}"

# =================================================================================================
# Full TCP — every one of the 65535 ports
# =================================================================================================
- category: "Full TCP"
  description: "Full TCP sweep, speed-tuned"
  why: "All 65535 TCP ports, rate-boosted to finish fast under exam time pressure. No versions yet."
  command: "nmap -p- --min-rate 2000 -T4 {target}"

- category: "Full TCP"
  description: "Full TCP sweep, host assumed up (-Pn)"
  why: "Windows/filtered hosts that drop ICMP echo would otherwise scan as down — -Pn skips the ping."
  command: "nmap -p- -Pn {target}"

- category: "Full TCP"
  description: "Full TCP, no ping, no DNS (fastest raw sweep)"
  why: "Skip host-discovery and reverse-DNS entirely — the leanest all-ports sweep for a known-up host."
  command: "nmap -p- -Pn -n --min-rate 2000 {target}"

# =================================================================================================
# Version & scripts — identify services and run safe default NSE
# =================================================================================================
- category: "Version & scripts"
  description: "Default scripts + version (-sC -sV)"
  why: "The standard 'what is this?' scan — service versions plus safe default NSE on the open ports."
  command: "nmap -sC -sV {target}"

- category: "Version & scripts"
  description: "Aggressive scan (-A: OS · version · scripts · traceroute)"
  why: "Everything at once — OS guess, versions, default scripts and traceroute. Thorough but loud."
  command: "nmap -A {target}"

- category: "Version & scripts"
  description: "Max-intensity version detection"
  why: "For stubborn/unknown services the default -sV can't identify — probes harder at every port."
  command: "nmap -sV --version-intensity 9 {target}"

- category: "Version & scripts"
  description: "Banner grab (lightweight NSE)"
  why: "Just the banner script on open ports — cheap service identification when -sV is too slow/loud."
  command: "nmap -sV --script banner {target}"

# =================================================================================================
# UDP — SNMP / DNS / TFTP / NTP / NetBIOS hide here (TCP scans never see them)
# =================================================================================================
- category: "UDP"
  description: "UDP quick triage (top 20)"
  why: "Fast UDP look — SNMP/DNS/TFTP/NTP/NetBIOS hide here and TCP scans never see them."
  command: "nmap -sU --top-ports 20 -T4 {target}"

- category: "UDP"
  description: "UDP top-100, versioned + default scripts"
  why: "The module's UDP pass has no -sV/-sC; this versions the common UDP services and runs safe NSE."
  command: "nmap -sU -sV -sC --top-ports 100 {target}"

# =================================================================================================
# Firewall / IDS evasion — packet-level, NO spoofing (exam-legal)
# =================================================================================================
- category: "Firewall / IDS evasion"
  description: "Connect scan (works through a proxychains/SOCKS pivot)"
  why: "SYN scans can't traverse a SOCKS proxy; -sT full-handshake does. Use over a ligolo tunnel."
  command: "nmap -sT -Pn -n {target}"

- category: "Firewall / IDS evasion"
  description: "Slow / stealthy timing (-T2)"
  why: "Gentle timing for fragile services or an IDS-sensitive network — fewer probes per second."
  command: "nmap -sV -T2 {target}"

- category: "Firewall / IDS evasion"
  description: "Paranoid timing (-T1, very slow)"
  why: "One probe at a time with long waits — for the most IDS-sensitive targets. Very slow; use sparingly."  # noqa
  command: "nmap -sS -T1 -Pn {target}"

- category: "Firewall / IDS evasion"
  description: "Source-port 53 full sweep (firewall bypass)"
  why: "Slip past stateless firewalls that trust source port 53 (DNS) — no identity spoofing."
  command: "nmap -p- -Pn --source-port 53 {target}"

- category: "Firewall / IDS evasion"
  description: "Fragmented packets (-f, firewall evasion)"
  why: "Split probes into tiny IP fragments to slip past simple packet filters. Slower, no spoofing."
  command: "nmap -f -Pn {target}"

- category: "Firewall / IDS evasion"
  description: "Random data padding (--data-length)"
  why: "Append random bytes so probes don't match a fixed nmap signature. No spoofing; just padding."
  command: "nmap -sS -Pn --data-length 25 {target}"

# =================================================================================================
# Active Directory / Windows
# =================================================================================================
- category: "Active Directory / Windows"
  description: "AD signature-port profile (is it a DC?)"
  why: "Confirm a Domain Controller fast from its signature ports (LDAP/Kerberos/SMB/global-catalog)."
  command: "nmap -p 53,88,135,139,389,445,464,593,636,3268,3269,5985 {target}"

- category: "Active Directory / Windows"
  description: "AD/DC full port profile, versioned + scripts"
  why: "Version + default NSE across every AD port — domain, KDC, LDAP(S), WinRM, ADWS in one pass."
  command: "nmap -sV -sC -p 53,88,135,139,389,445,464,593,636,3268,3269,5985,9389 {target}"

- category: "Active Directory / Windows"
  description: "Windows / SMB surface, versioned + scripts"
  why: "Version + default NSE on the Windows/SMB ports (RPC, NetBIOS, SMB, RDP, WinRM)."
  command: "nmap -sV -sC -p 135,139,445,3389,5985 {target}"

- category: "Active Directory / Windows"
  description: "SMB vuln NSE (EternalBlue etc., detection only)"
  why: "Runs the safe smb-vuln-* NSE scripts to flag MS17-010 and friends — detection, never exploit."
  command: "nmap -p 445 --script 'smb-vuln-*' {target}"

# =================================================================================================
# Service-focused — just the ports for one class of service
# =================================================================================================
- category: "Service-focused"
  description: "Web ports sweep (all common HTTP/HTTPS), versioned"
  why: "Just the common web ports, versioned — find every HTTP/HTTPS surface (incl. 8080/8443/3000)."
  command: "nmap -sV -p 80,443,8000,8008,8080,8081,8443,8888,9000,9090,3000,5000 {target}"

- category: "Service-focused"
  description: "Database ports, versioned"
  why: "MSSQL/Oracle/MySQL/Postgres/Redis/Mongo in one versioned pass — spot an exposed DB fast."
  command: "nmap -sV -p 1433,1521,3306,5432,6379,27017 {target}"

- category: "Service-focused"
  description: "Mail ports, versioned + scripts"
  why: "SMTP/POP3/IMAP (+ submission/secure variants) versioned with safe NSE — user-enum surface."
  command: "nmap -sV -sC -p 25,110,143,465,587,993,995 {target}"

# =================================================================================================
# Host discovery — single host or a whole /24 (pivoting)
# =================================================================================================
- category: "Host discovery"
  description: "Ping-sweep host discovery (edit to a subnet for pivoting)"
  why: "Find live hosts across a range when pivoting into an internal/AD network. Edit {target} to a /24."
  command: "nmap -sn -n {target}"

- category: "Host discovery"
  description: "Host discovery, ICMP + TCP (beats filtered hosts)"
  why: "Find live hosts even when ICMP is filtered — TCP-pings common ports too. Same idea as the pre-flight check."  # noqa
  command: "nmap -sn -PE -PS21,22,80,443,445,3389 -PA80,443 -n {target}"

# =================================================================================================
# OS & vulnerability
# =================================================================================================
- category: "OS & vulnerability"
  description: "OS fingerprint (needs root)"
  why: "TCP/IP stack fingerprint steers Linux-vs-Windows follow-ups. Needs raw sockets (root)."
  command: "nmap -O --osscan-guess {target}"

- category: "OS & vulnerability"
  description: "Vuln NSE category sweep (opt-in, slow/noisy)"
  why: "§8 allows --script vuln — flags known service weaknesses, detection only (never exploits)."
  command: "nmap -sV --script vuln {target}"

# =================================================================================================
# ==  EXTENDED SET  ===============================================================================
# More labelled options for common situations. All recon-only (§8): plain nmap + enumeration NSE,
# no brute (oracle-sid-brute is the sole allowed exception — it enumerates SIDs, not passwords),
# no spoofing.
# =================================================================================================

# ---- Fast / triage --------------------------------------------------------------------------------
- category: "Fast / triage"
  description: "Top 20 ports (instant)"
  why: "The absolute-fastest sanity ping — is anything obvious open? Then widen the net."
  command: "nmap --top-ports 20 -T4 {target}"

- category: "Fast / triage"
  description: "Ping-less quick triage (top 100, -Pn)"
  why: "Same quick top-100 look but assumes the host is up — for boxes that drop ICMP echo."
  command: "nmap --top-ports 100 -Pn -T4 -n {target}"

- category: "Fast / triage"
  description: "Only-open, quiet (top 200)"
  why: "Top-200 ports, hide closed/filtered noise (--open), no DNS — a clean 'what's open' readout."
  command: "nmap --top-ports 200 --open -T4 -n {target}"

# ---- Full TCP -------------------------------------------------------------------------------------
- category: "Full TCP"
  description: "Full TCP — versioned + default scripts (the works, one pass)"
  why: "All 65535 ports WITH versions and safe default NSE in one rate-boosted command."
  command: "nmap -p- -sV -sC -T4 --min-rate 1000 {target}"

- category: "Full TCP"
  description: "Full TCP — only-open, with reasons"
  why: "Every port, host assumed up, show only open ports and WHY nmap thinks so (--reason)."
  command: "nmap -p- -Pn --open --reason -T4 {target}"

- category: "Full TCP"
  description: "Full TCP — trimmed retries (lossy links / pivots)"
  why: "Fewer retransmits + a rate floor so a full sweep finishes over a flaky ligolo tunnel."
  command: "nmap -p- -Pn -n --max-retries 2 --min-rate 1500 {target}"

# ---- Version & scripts ----------------------------------------------------------------------------
- category: "Version & scripts"
  description: "Default + safe scripts"
  why: "Versions plus the 'default' AND 'safe' NSE categories — broader than -sC, still non-intrusive."
  command: "nmap -sV --script \"default,safe\" {target}"

- category: "Version & scripts"
  description: "Discovery scripts"
  why: "The NSE 'discovery' category — extra info (rpcinfo, snmp, http-* enum) from open ports."
  command: "nmap -sV --script discovery {target}"

- category: "Version & scripts"
  description: "Fast version detect (--version-light)"
  why: "Lighter -sV probe set — quicker identification when the full intensity is too slow."
  command: "nmap -sV --version-light {target}"

# ---- UDP ------------------------------------------------------------------------------------------
- category: "UDP"
  description: "UDP top-200, versioned"
  why: "A wider UDP net (top-200) with versions — catches the less-common UDP services too."
  command: "nmap -sU -sV --top-ports 200 {target}"

- category: "UDP"
  description: "Common UDP services (DNS/TFTP/NTP/NetBIOS/SNMP/IKE)"
  why: "Just the UDP ports that actually matter for OSCP — fast and targeted instead of top-N."
  command: "nmap -sU -sV -p 53,69,123,137,161,500 {target}"

- category: "UDP"
  description: "SNMP focus (+info scripts)"
  why: "SNMP on 161/udp with the info scripts — system, processes and interfaces via public community."
  command: "nmap -sU -p 161 --script \"snmp-info,snmp-sysdescr,snmp-processes,snmp-interfaces\" {target}"

# ---- Firewall / IDS evasion -----------------------------------------------------------------------
- category: "Firewall / IDS evasion"
  description: "MTU fragmentation (--mtu 16)"
  why: "Fragment probes to a 16-byte MTU to slip past simple stateless filters. No spoofing."
  command: "nmap -Pn --mtu 16 {target}"

- category: "Firewall / IDS evasion"
  description: "Scan delay (throttle, IDS-gentle)"
  why: "One second between probes — low-and-slow so a rate-based IDS doesn't trip. Slow but quiet."
  command: "nmap -sV --scan-delay 1s {target}"

- category: "Firewall / IDS evasion"
  description: "Bad-checksum probe (spot dumb filters)"
  why: "Send deliberately-wrong TCP checksums — a host that still replies has a naive filter. Detection only."
  command: "nmap -Pn --badsum {target}"

# ---- Active Directory / Windows -------------------------------------------------------------------
- category: "Active Directory / Windows"
  description: "SMB full enum scripts (shares/users/os/sessions)"
  why: "The whole safe smb-enum-* battery on 445 — shares, users, sessions, domains, OS, signing."
  command: "nmap -p 445 --script \"smb-os-discovery,smb-enum-shares,smb-enum-users,smb-enum-sessions,smb-enum-domains,smb-security-mode,smb2-security-mode\" {target}"

- category: "Active Directory / Windows"
  description: "SMB protocols + signing posture"
  why: "Which SMB dialects are offered and whether signing is required — the relay-candidate check."
  command: "nmap -p 139,445 --script \"smb-protocols,smb2-capabilities,smb-security-mode,smb2-security-mode\" {target}"

- category: "Active Directory / Windows"
  description: "LDAP anonymous rootDSE"
  why: "Anonymous LDAP root-DSE dump — naming contexts, domain functional level, DC hostname."
  command: "nmap -p 389 --script \"ldap-rootdse\" {target}"

- category: "Active Directory / Windows"
  description: "RDP info + encryption / NLA"
  why: "NTLM info (domain, hostname, build) and the encryption/NLA posture from 3389 — no login."
  command: "nmap -p 3389 --script \"rdp-ntlm-info,rdp-enum-encryption\" {target}"

- category: "Active Directory / Windows"
  description: "MSRPC endpoint mapper (135)"
  why: "Enumerate the RPC endpoint mapper on 135 — service interfaces bound on the box."
  command: "nmap -p 135 --script \"msrpc-enum\" {target}"

# ---- Service-focused ------------------------------------------------------------------------------
- category: "Service-focused"
  description: "HTTP enum scripts (title/headers/methods/robots/enum)"
  why: "The safe http-* enumeration set across the common web ports — a fast first web look."
  command: "nmap -sV -p 80,443,8080,8443 --script \"http-title,http-headers,http-methods,http-robots.txt,http-enum\" {target}"

- category: "Service-focused"
  description: "HTTP security headers + TLS cert"
  why: "Missing security headers plus the TLS cert/cipher detail on the HTTPS ports."
  command: "nmap -sV -p 443,8443 --script \"http-security-headers,ssl-cert,ssl-enum-ciphers\" {target}"

- category: "Service-focused"
  description: "FTP anonymous + system"
  why: "Anonymous-login check and the FTP system type on 21 — the classic easy win."
  command: "nmap -sV -p 21 --script \"ftp-anon,ftp-syst\" {target}"

- category: "Service-focused"
  description: "SSH host keys + algorithms + auth methods"
  why: "Host-key fingerprints, supported algos and which auth methods 22 accepts (keys vs password)."
  command: "nmap -sV -p 22 --script \"ssh-hostkey,ssh2-enum-algos,ssh-auth-methods\" {target}"

- category: "Service-focused"
  description: "DNS server info + recursion"
  why: "Server id, open recursion and cache-snoop on 53 — is this a resolver you can lean on?"
  command: "nmap -sV -p 53 --script \"dns-nsid,dns-recursion,dns-cache-snoop\" {target}"

- category: "Service-focused"
  description: "SMTP commands + open-relay + NTLM"
  why: "Supported SMTP verbs, open-relay test and NTLM info on 25/465/587 — mail-server recon."
  command: "nmap -sV -p 25,465,587 --script \"smtp-commands,smtp-open-relay,smtp-ntlm-info\" {target}"

- category: "Service-focused"
  description: "NFS exports + mounts (safe)"
  why: "showmount exports, statfs and a bounded listing via the safe nfs-* scripts + rpcinfo."
  command: "nmap -sV -p 111,2049 --script \"nfs-showmount,nfs-statfs,nfs-ls,rpcinfo\" {target}"

- category: "Service-focused"
  description: "MySQL info"
  why: "Protocol/version/capabilities from 3306 without logging in — pre-cred recon."
  command: "nmap -sV -p 3306 --script \"mysql-info\" {target}"

- category: "Service-focused"
  description: "MSSQL info + NTLM"
  why: "Instance name, version and NTLM (domain/host) from 1433 — no credentials needed."
  command: "nmap -sV -p 1433 --script \"ms-sql-info,ms-sql-ntlm-info\" {target}"

- category: "Service-focused"
  description: "Redis info"
  why: "Unauth INFO from 6379 — role, version, and whether it's wide open."
  command: "nmap -sV -p 6379 --script \"redis-info\" {target}"

- category: "Service-focused"
  description: "MongoDB info + databases"
  why: "Build info and, if unauth, the database list from 27017 — no login attempted."
  command: "nmap -sV -p 27017 --script \"mongodb-info,mongodb-databases\" {target}"

- category: "Service-focused"
  description: "VNC info + auth types"
  why: "Protocol, supported auth types and the RealVNC auth-bypass check across 5900-5906. Detection only."
  command: "nmap -sV -p 5900-5906 --script \"vnc-info,vnc-title,realvnc-auth-bypass\" {target}"

- category: "Service-focused"
  description: "Oracle TNS version + SID enum"
  why: "TNS listener version and SID enumeration on 1521 — oracle-sid-brute enumerates SIDs (identifiers), not passwords (§ allowed)."
  command: "nmap -sV -p 1521 --script \"oracle-tns-version,oracle-sid-brute\" {target}"

- category: "Service-focused"
  description: "NetBIOS name table (137/udp)"
  why: "nbstat name/MAC table on 137/udp — hostname and logged-on hints before SMB."
  command: "nmap -sU -sV -p 137 --script \"nbstat\" {target}"

# ---- TLS / SSL ------------------------------------------------------------------------------------
- category: "TLS / SSL"
  description: "Cipher + certificate audit"
  why: "Full cipher suite grading and the certificate detail (CN/SAN/issuer/validity) on 443."
  command: "nmap -sV -p 443 --script \"ssl-cert,ssl-enum-ciphers\" {target}"

- category: "TLS / SSL"
  description: "Heartbleed check"
  why: "CVE-2014-0160 detection on 443 — the classic OpenSSL memory leak. Detection only."
  command: "nmap -p 443 --script \"ssl-heartbleed\" {target}"

- category: "TLS / SSL"
  description: "Weak-TLS sweep (POODLE / DH / SSLv2 / CCS)"
  why: "Legacy-protocol and weak-parameter checks in one pass — POODLE, weak DH, SSLv2, CCS injection."
  command: "nmap -p 443 --script \"ssl-poodle,ssl-dh-params,sslv2,ssl-ccs-injection\" {target}"

# ---- OS & vulnerability ---------------------------------------------------------------------------
- category: "OS & vulnerability"
  description: "Safe vuln scripts only (less noisy)"
  why: "Only the vuln scripts also tagged 'safe' — flags weaknesses without the intrusive checks."
  command: "nmap -sV --script \"vuln and safe\" {target}"

- category: "OS & vulnerability"
  description: "HTTP vuln scripts (web weaknesses)"
  why: "The http-vuln-* family on the web ports — known web-app/server CVEs, detection only."
  command: "nmap -sV -p 80,443,8080,8443 --script \"http-vuln*\" {target}"

- category: "OS & vulnerability"
  description: "SMB MS17-010 (EternalBlue) focus"
  why: "Just the MS17-010 detection on 445 — the single most common Windows quick-win. Detection only."
  command: "nmap -p 445 --script \"smb-vuln-ms17-010\" {target}"

