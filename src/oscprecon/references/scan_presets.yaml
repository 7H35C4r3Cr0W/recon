  command: "nmap -sV --script \"banner,http-title,ssl-cert,smb-os-discovery\" {target}"

# ---- Verbose / debug ------------------------------------------------------------------------------
- category: "Verbose / debug"
  description: "Verbose, only-open, with reasons"
  why: "Live progress (-v), only open ports, and WHY each is open (--reason) — a clean readable run."
  command: "nmap -sV -v --open --reason {target}"

- category: "Verbose / debug"
  description: "Packet trace (debug a filtered/odd host)"
  why: "Print every probe/response (--packet-trace) on the top-20 ports — see exactly what a firewall does."
