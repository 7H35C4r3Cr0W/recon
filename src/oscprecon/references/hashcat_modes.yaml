# Curated hashcat hash-mode (-m) reference — a DECISION AID for picking the right mode and building
# the crack command. NOT box-specific; a reusable syntax helper (a big pain point: which -m is this?).
# Each entry: mode (the -m number), name (searchable label), category. Sourced from hashcat --help /
# the BHIS hashcat cheat sheet. Curated to the modes a pentester actually meets, across every family.

- category: "Raw hash"
  modes:
    - { mode: 900, name: "MD4" }
    - { mode: 0, name: "MD5" }
    - { mode: 100, name: "SHA1" }
    - { mode: 1300, name: "SHA-224" }
    - { mode: 1400, name: "SHA-256" }
    - { mode: 10800, name: "SHA-384" }
    - { mode: 1700, name: "SHA-512" }
    - { mode: 5000, name: "SHA-3 (Keccak)" }
    - { mode: 6000, name: "RIPEMD-160" }
    - { mode: 6100, name: "Whirlpool" }
    - { mode: 600, name: "BLAKE2b-512" }
    - { mode: 5100, name: "Half MD5" }

- category: "Raw hash + salt"
  modes:
    - { mode: 10, name: "md5($pass.$salt)" }
    - { mode: 20, name: "md5($salt.$pass)" }
    - { mode: 3800, name: "md5($salt.$pass.$salt)" }
    - { mode: 2600, name: "md5(md5($pass))" }
    - { mode: 110, name: "sha1($pass.$salt)" }
    - { mode: 120, name: "sha1($salt.$pass)" }
    - { mode: 4500, name: "sha1(sha1($pass))" }
    - { mode: 1410, name: "sha256($pass.$salt)" }
    - { mode: 1420, name: "sha256($salt.$pass)" }
    - { mode: 1710, name: "sha512($pass.$salt)" }
    - { mode: 1720, name: "sha512($salt.$pass)" }

- category: "HMAC / authenticated"
  modes:
    - { mode: 50, name: "HMAC-MD5 (key=$pass)" }
    - { mode: 150, name: "HMAC-SHA1 (key=$pass)" }
    - { mode: 1450, name: "HMAC-SHA256 (key=$pass)" }
    - { mode: 1750, name: "HMAC-SHA512 (key=$pass)" }
    - { mode: 10200, name: "CRAM-MD5" }
    - { mode: 16400, name: "CRAM-MD5 Dovecot" }

- category: "KDF / slow hash"
  modes:
    - { mode: 400, name: "phpass (WordPress/Joomla/phpBB3)" }
    - { mode: 3200, name: "bcrypt $2*$ (Blowfish/Unix)" }
    - { mode: 8900, name: "scrypt" }
    - { mode: 11900, name: "PBKDF2-HMAC-MD5" }
    - { mode: 12000, name: "PBKDF2-HMAC-SHA1" }
    - { mode: 10900, name: "PBKDF2-HMAC-SHA256" }
    - { mode: 12100, name: "PBKDF2-HMAC-SHA512" }

- category: "Unix / OS password"
  modes:
    - { mode: 500, name: "md5crypt $1$ (MD5-Unix, Cisco-IOS $1$)" }
    - { mode: 1600, name: "Apache apr1 $apr1$ / md5apr1 / .htpasswd" }
    - { mode: 7400, name: "sha256crypt $5$ (SHA256-Unix)" }
    - { mode: 1800, name: "sha512crypt $6$ (SHA512-Unix / /etc/shadow)" }
    - { mode: 1500, name: "descrypt (DES-Unix, traditional)" }
    - { mode: 12400, name: "BSDi Crypt / Extended DES" }
    - { mode: 30600, name: "yescrypt $y$" }
    - { mode: 3000, name: "LM" }
    - { mode: 1000, name: "NTLM" }
    - { mode: 1100, name: "Domain Cached Creds (DCC / MS Cache 1)" }
    - { mode: 2100, name: "Domain Cached Creds 2 (DCC2 / MS Cache 2)" }
    - { mode: 122, name: "macOS 10.4-10.6" }
    - { mode: 1722, name: "macOS 10.7" }
    - { mode: 7100, name: "macOS 10.8+ (PBKDF2-SHA512)" }

- category: "Network auth / Kerberos / NTLM"
  modes:
    - { mode: 5500, name: "NetNTLMv1 (+ESS)" }
    - { mode: 5600, name: "NetNTLMv2" }
    - { mode: 7500, name: "Kerberos 5 AS-REQ Pre-Auth etype 23 (AS-REP roast)" }
    - { mode: 13100, name: "Kerberos 5 TGS-REP etype 23 (Kerberoast)" }
    - { mode: 18200, name: "Kerberos 5 AS-REP etype 23" }
    - { mode: 19600, name: "Kerberos 5 TGS-REP etype 17 (AES128)" }
    - { mode: 19700, name: "Kerberos 5 TGS-REP etype 18 (AES256)" }
    - { mode: 7300, name: "IPMI2 RAKP HMAC-SHA1" }
    - { mode: 5300, name: "IKE-PSK MD5" }
    - { mode: 5400, name: "IKE-PSK SHA1" }
    - { mode: 11400, name: "SIP digest auth (MD5)" }
    - { mode: 16500, name: "JWT (JSON Web Token)" }
    - { mode: 2500, name: "WPA/WPA2 (hccapx)" }
