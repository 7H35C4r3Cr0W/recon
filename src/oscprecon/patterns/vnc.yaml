# VNC recon next-steps (vnc-info + vnc-title, read-only, no password guessing). A "None" security
# type means the display is open; VNC password brute is Tier-3 (Spray-mode only) and never suggested.
- match:
    service: vnc
    field: kind
    value: "^access$"
  suggest:
    - text: "VNC 'None' auth — the display is open with no password; confirm read-only with a viewer"
      command: "nmap -p 5900 --script vnc-title {target}"
# source: Obsidian: 0.00 Methdology/.../Ports and tools.md (per-port enum reference)

- match:
    service: vnc
    field: kind
    value: "^security$"
  suggest:
    - text: "Note the offered VNC security types + version for reference (no password guessing here)"
      command: "nmap -p 5900 --script vnc-info {target}"
# source: Obsidian: 0.00 Methdology/.../Ports and tools.md (per-port enum reference)

- match:
    service: vnc
    field: kind
    value: "^version$"
  suggest:
    - text: "Read the desktop name to identify the host/session behind the VNC display"
      command: "nmap -p 5900 --script vnc-title {target}"
# source: Obsidian: 0.00 Methdology/.../Ports and tools.md (per-port enum reference)
