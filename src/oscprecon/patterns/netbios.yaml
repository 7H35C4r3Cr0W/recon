# NetBIOS recon next-steps from the maintainer's methodology notes.
# netbios findings the module emits: hostname, domain, role, user, mac.

- match:
    service: netbios
    field: kind
    value: "domain"
  suggest:
    - text: "NetBIOS domain '{value}' — pivot to broad SMB/AD enumeration"
      command: "enum4linux-ng -A {target}"
