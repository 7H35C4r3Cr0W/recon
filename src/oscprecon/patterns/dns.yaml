# DNS recon next-steps from the maintainer's methodology notes. Set {domain} if the profile has no hostname yet.
# dns findings the module emits: record, recursion, version, zone-transfer.

- match:
    service: dns
  suggest:
    - text: "Enumerate name servers (NS)"
      command: "dig {domain} @{target} -t NS +noall +answer"
    - text: "Enumerate mail servers (MX)"
      command: "dig {domain} @{target} -t MX +noall +answer"
    - text: "Enumerate TXT records (often leak hostnames / SPF / internal notes)"
      command: "dig {domain} @{target} -t TXT +noall +answer"
    - text: "Attempt a full zone transfer (AXFR) — dumps every record if the server allows it"
      command: "dig {domain} @{target} axfr"
# source: Obsidian: 0.01 Cheatsheets .../Other/53 _ DNS.md

- match:
    service: dns
  suggest:
    - text: "Check for a WPAD/PAC file — wpad.{domain} serving wpad.dat leaks the internal proxy config (which subnets go direct vs. via a proxy = the internal network map)"
      command: "curl -s http://wpad.{domain}/wpad.dat"
    - text: "Confirm wpad.{domain} resolves first (a stray A record for wpad often points at the DC / proxy host worth enumerating)"
      command: "dig +short wpad.{domain} @{target}"
# source: HackTricks — network-services-pentesting / spoofing-llmnr-nbt-ns-mdns-dns-and-wpad-and-relay-attacks (WPAD/PAC discovery)
