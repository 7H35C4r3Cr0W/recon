# AJP recon next-steps (ajp-methods + ajp-headers, read-only). AJP fronts a Tomcat instance — the
# next move is enumerating the paired HTTP connector. The Ghostcat CVE is exploitation, never here.
- match:
    service: ajp
    field: kind
    value: "^methods$"
  suggest:
    - text: "AJP13 is live — enumerate the paired Tomcat HTTP connector (usually 8080) for /manager"
      command: "nmap -sV -p 8080 --script http-title,http-server-header {target}"
# source: HackTricks 8009-pentesting-apache-jserv-protocol-ajp (book.hacktricks.wiki)

- match:
    service: ajp
    field: kind
    value: "^server$"
  suggest:
    - text: "Fingerprint the Tomcat version from the fronted HTTP app to match documented CVEs"
      command: "whatweb http://{target}:8080"
# source: HackTricks 8009-pentesting-apache-jserv-protocol-ajp (book.hacktricks.wiki)
