# IMAP recon next-steps (capabilities + NTLM, read-only). Mailbox login / credential guessing are
# Tier-3 (Spray mode) and never suggested; the useful signals are the AD domain leak and TLS posture.
- match:
    service: imap
    field: kind
    value: "^domain$"
  suggest:
    - text: "IMAP NTLM leaks the AD domain (Exchange) — pivot into LDAP / SMB / Kerberos enumeration"
      command: "nmap -p 389 --script ldap-rootdse {target}"
# source: Obsidian: .../Ports and tools.md (per-port enum reference)

- match:
    service: imap
    field: kind
    value: "^version$"
  suggest:
    - text: "Read the TLS banner on 993 to confirm the mail product/version and certificate identity"
      command: "openssl s_client -connect {target}:993 -quiet"
# source: Obsidian: .../Ports and tools.md (per-port enum reference)
