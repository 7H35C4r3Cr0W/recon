<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="cytoscape.min.js"></script>
    <script src="cytoscape-svg.js"></script>
  </head>
  <body>
    <div id="toolbar">
      <input id="search" type="search" placeholder="search: ssh, 445, admin…" />
      <button id="layout-hier">Hierarchical</button>
      <button id="layout-force">Force-directed</button>
      <button id="fit">Fit</button>
      <button id="link-mode">Link mode</button>
      <button id="export-png">Export PNG</button>
      <button id="export-svg">Export SVG</button>
      <span id="filters">
        <label class="filter-label"><input type="checkbox" class="filter" data-type="service" checked /> services</label>
        <label class="filter-label"><input type="checkbox" class="filter" data-type="finding" checked /> findings</label>
        <label class="filter-label"><input type="checkbox" class="filter" data-type="credential" checked /> creds</label>
      </span>
      <span id="hint">search · red ring = notable · dbl-click a service to collapse · drag (saved) · click for detail</span>
    </div>
    <div id="cy"></div>
    <div id="minimap"><div id="minimap-viewport"></div></div>
    <script src="app.js"></script>
  </body>
</html>
