<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="No projects yet">
  <!-- calm empty-state scene: a clay tablet with a faint recon graph waiting to be started -->
  <rect x="120" y="70" width="240" height="180" rx="18" fill="#161d2b" stroke="#2a3446" stroke-width="2"/>
  <g stroke="#5b8a8f" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="240" y1="160" x2="188" y2="122"/>
    <line x1="240" y1="160" x2="300" y2="128"/>
    <line x1="240" y1="160" x2="222" y2="214"/>
  </g>
  <circle cx="240" cy="160" r="13" fill="#c9a227" fill-opacity="0.85"/>
  <circle cx="188" cy="122" r="8" fill="#5b8a8f" fill-opacity="0.7"/>
  <circle cx="300" cy="128" r="8" fill="#5b8a8f" fill-opacity="0.7"/>
  <circle cx="222" cy="214" r="8" fill="#5b8a8f" fill-opacity="0.7"/>
  <!-- add prompt -->
  <circle cx="240" cy="272" r="18" fill="none" stroke="#c9a227" stroke-width="3"/>
  <path d="M240 264 v16 M232 272 h16" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
  <text x="240" y="308" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8a94a6">Create a project to begin recon</text>
</svg>
