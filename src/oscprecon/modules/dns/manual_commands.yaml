# DNS manual follow-ups (Tier-2 — shown, never auto-run; §5/§11). DNS-PROTOCOL queries only:
# subdomain brute-forcing (dnsenum/dns-brute/dnsrecon -t brt) belongs to the vhost module, not here.
# {target} is the DNS server, {domain} the zone, {port} the port — all filled from the profile.
# TARGET_IP is a literal you edit before running the reverse lookup.

- description: "ANY records for the zone"
  why: "One query that returns every record type the server will disclose — recon"
  command: "dig @{target} {domain} ANY"

- description: "Explicit zone transfer (AXFR)"
  why: "Re-attempt the full zone dump — the single biggest DNS recon win when misconfigured"
  command: "dig @{target} {domain} AXFR"

- description: "dnsrecon zone-transfer attempt"
  why: "Second AXFR path — dnsrecon iterates every NS it finds for the zone"
  command: "dnsrecon -n {target} -d {domain} -t axfr"

- description: "Nameserver + mail records"
  why: "NS/MX reveal other DNS and mail hosts to enumerate — recon"
  command: "dig @{target} {domain} NS +short"

- description: "TXT records (SPF / verification strings)"
  why: "TXT records often leak infrastructure and third-party services — recon"
  command: "dig @{target} {domain} TXT +short"

- description: "Reverse PTR lookup for a discovered IP"
  why: "Map an IP back to a hostname to expand the target picture — recon"
  command: "dig @{target} -x TARGET_IP"

- description: "Reverse-PTR sweep across the /24"
  why: "PTR records across the subnet reveal internal hostnames + naming conventions — recon"
  command: "dnsrecon -r {target}/24 -n {target}"
# source: Obsidian: OSCP/6.3.1 DNS Enumeration.md

- description: "DNSSEC signing check (DNSKEY / RRSIG)"
  why: "Shows whether the zone is DNSSEC-signed — a quick DNS-deployment fingerprint — recon"
  command: "dig @{target} {domain} +dnssec +noall +answer"
# source: Obsidian: OSCP/6.3.1 DNS Enumeration.md

- description: "DC-locator: enumerate every domain controller in the forest"
  why: "The _ldap._tcp.dc._msdcs SRV record lists all DCs — key AD recon"
  command: "dig @{target} _ldap._tcp.dc._msdcs.{domain} SRV +short"
# source: Obsidian: Boxes/.../Dante/172.16.1.20/53.md

- description: "Locate Kerberos KDC hosts"
  why: "The _kerberos._tcp SRV record points at the KDC(s) — recon"
  command: "dig @{target} _kerberos._tcp.{domain} SRV +short"
# source: Obsidian: Boxes/.../Dante/172.16.1.20/53.md

- description: "SOA — primary nameserver + admin contact"
  why: "The SOA record names the authoritative server and admin mailbox — recon"
  command: "dig @{target} {domain} SOA +short"
# source: Obsidian: CPTS/Footprinting/Digging DNS.md

- description: "One-pass standard record sweep"
  why: "dnsrecon std pulls A/NS/MX/SOA/SRV/TXT in one go — recon"
  command: "dnsrecon -n {target} -d {domain} -t std"
# source: Obsidian: OSCP/6.3.1 DNS Enumeration.md
