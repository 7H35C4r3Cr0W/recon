# rsync manual follow-ups (Tier-2 — shown, never auto-run). Read-only listing; {target}/{port}/{module}
# filled from the active profile. Downloading files and auth to a password-protected module stop here.
- description: "List a module's contents (read-only)"
  why: "rsync --list-only on a module enumerates its top-level files/dirs without downloading"
  command: "rsync --list-only rsync://{target}:{port}/{module}/"
# source: Obsidian: .../Ports and tools.md (per-port enum reference)

- description: "Recursive listing of a module (bounded)"
  why: "-r --list-only walks the module tree read-only; keep it bounded, never download"
  command: "rsync -r --list-only rsync://{target}:{port}/{module}/"
# source: Obsidian: .../Ports and tools.md (per-port enum reference)

- description: "nmap module list (NSE)"
  why: "rsync-list-modules confirms the exposed modules via nmap — read-only"
  command: "nmap -p {port} --script rsync-list-modules {target}"
# source: Obsidian: .../Ports and tools.md (per-port enum reference)
