# LDAP manual follow-ups (Tier-2 — shown, never auto-run; §11/§12). Anonymous (-x) enumeration is
# recon; authenticated queries reuse a credential the tool already collected (never a brute/list).
# {target}/{port} come from the profile; {basedn} is the discovered/entered base DN (validated
# before it reaches a command); {user}/{domain}/{password} come from creds.json when present.

- description: "Dump everything under the base DN (anonymous)"
  why: "Full anonymous directory read — the broadest single recon query"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=*)"'

- description: "List users (anonymous)"
  why: "Enumerate account names to feed SMB / Kerberos enumeration"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=user)" sAMAccountName'

- description: "List groups and members (anonymous)"
  why: "Map group membership — high-value AD recon"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=group)" cn member'

- description: "List computers / OS (anonymous)"
  why: "Enumerate domain-joined hosts and their OS for the target picture"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=computer)" dNSHostName operatingSystem'

- description: "Hunt for secrets in user description fields (anonymous)"
  why: "description/info attributes sometimes hold plaintext passwords — read-only recon"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=user)" sAMAccountName description info'

- description: "Query over LDAPS (self-signed labs need LDAPTLS_REQCERT=never)"
  why: "Some DCs only answer on 636/TLS — set the env var in your terminal if the cert is self-signed"
  command: 'ldapsearch -x -H ldaps://{target}:636 -b "{basedn}" "(objectClass=*)"'

- description: "Authenticated bind with a collected credential (edit USER/DOMAIN/PASSWORD)"
  why: "Re-query as a known user (creds already gathered) — a single bind, not a brute force"
  command: 'ldapsearch -x -H ldap://{target}:{port} -D "USER@DOMAIN" -w PASSWORD -b "{basedn}" "(objectClass=user)" sAMAccountName'
  requires: ["creds"]

- description: "Dump AD-integrated DNS records over a null bind"
  why: "netexec ldap get-network reads AD DNS zones anonymously — read-only recon"
  command: "netexec ldap {target} -u '' -p '' -M get-network -o ALL=true"
# source: Obsidian: 0.00 Methdology/.../Active Directory Methdology/Full AD enum.md

- description: "Enumerate AdminSDHolder-protected accounts"
  why: "--admin-count lists high-value protected accounts — read-only recon"
  command: "netexec ldap {target} -u USER -p PASS --admin-count"
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../Active Directory Methdology/Full AD enum.md

- description: "All users with last-logon + pwdLastSet"
  why: "GetADUsers enumerates account metadata (enumeration script, no cracking)"
  command: "GetADUsers.py -all {domain}/USER:PASS -dc-ip {target}"
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../OSCP Random/445 SMB.md

- description: "Anonymous LDAP user enumeration (windapsearch)"
  why: "windapsearch lists users over an anonymous bind — read-only recon"
  command: "windapsearch --dc-ip {target} -u '' -U"
# source: Obsidian: 0.00 Methdology/.../Other Services/Other/389 _ LDAP.md

- description: "Dump AD to HTML/CSV over anonymous bind"
  why: "ldapdomaindump writes users/groups/computers/policy files — read-only recon"
  command: "ldapdomaindump ldap://{target}"
# source: Obsidian: 0.01 Cheatsheets/Impacket Tools.md

- description: "AS-REP-roastable accounts (DONT_REQ_PREAUTH) via LDAP filter"
  why: "Bitwise filter lists pre-auth-disabled accounts — read-only enum (no ticket request)"
  command: 'ldapsearch -x -H ldap://{target} -D USER@DOMAIN -w PASSWORD -b {basedn} "(&(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=4194304))" sAMAccountName'
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../Credentialed LDAP Enumeration.md

- description: "SPN-owning (kerberoastable) accounts via LDAP filter"
  why: "Lists accounts with a servicePrincipalName — read-only enum (no ticket request)"
  command: 'ldapsearch -x -H ldap://{target} -D USER@DOMAIN -w PASSWORD -b {basedn} "(&(objectClass=user)(servicePrincipalName=*))" sAMAccountName servicePrincipalName'
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../Credentialed LDAP Enumeration.md

- description: "Unconstrained-delegation accounts via LDAP filter"
  why: "Bitwise filter lists TRUSTED_FOR_DELEGATION accounts — read-only enum"
  command: 'ldapsearch -x -H ldap://{target} -D USER@DOMAIN -w PASSWORD -b {basedn} "(&(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=524288))" sAMAccountName'
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../Credentialed LDAP Enumeration.md

- description: "Enumerate AD Certificate Services (CAs + templates)"
  why: "netexec adcs module lists CAs / cert templates — read-only recon that surfaces ESC misconfigs"
  command: "netexec ldap {target} -u USER -p PASS -M adcs"
  requires: ["creds"]
# source: AD-toolkit eval (netexec ldap enum modules — read-only)

- description: "Read the machine account quota (MachineAccountQuota)"
  why: "netexec maq reads ms-DS-MachineAccountQuota — a read-only fact (>0 enables RBCD/add-computer paths)"
  command: "netexec ldap {target} -u USER -p PASS -M maq"
  requires: ["creds"]
# source: AD-toolkit eval (netexec ldap enum modules — read-only)

- description: "Check LDAP signing / channel-binding posture (null bind)"
  why: "netexec ldap-checker reports whether LDAP signing + channel binding are enforced — read-only relay-susceptibility recon, no attack"
  command: "netexec ldap {target} -u '' -p '' -M ldap-checker"
# source: AD-toolkit eval (netexec ldap enum modules — read-only)

# --- netexec LDAP modules — credentialed AD enum (HTB AD Path) ------------------------------------
# {user}/{password} pre-fill from the first collected credential. All read-only enumeration.
- description: "User descriptions (often contain passwords)"
  why: "netexec ldap -M user-desc dumps every user's description field — admins hide passwords/hints here. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M user-desc"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "User descriptions — tune the flagged keywords"
  why: "-o KEYWORDS=… (msfvenom-style) overrides the module's default match list, so a desc holding 'pwd'/'key'/'admin' surfaces instead of hiding in the full dump. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M user-desc -o 'KEYWORDS=pwd,pass,key,admin'"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec/Working with Modules.md

- description: "All user descriptions (get-desc-users)"
  why: "netexec ldap -M get-desc-users lists descriptions for all users — a superset dump to grep for creds. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M get-desc-users"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "LAPS local-admin passwords (readable ones)"
  why: "netexec ldap -M laps reads every LAPS-managed local admin password your account can read — instant local admin. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M laps"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "MachineAccountQuota (can you add computers?)"
  why: "netexec ldap -M maq reads ms-DS-MachineAccountQuota — >0 means you can add a machine account (RBCD/shadow-cred prep). Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M maq"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Find ADCS PKI services + templates"
  why: "netexec ldap -M adcs lists Enrollment Services and certificate template names — the recon step before certipy ESC checks. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M adcs"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Group membership of a user"
  why: "netexec ldap -M groupmembership shows which groups a user belongs to (spot Domain Admins / Server Operators). Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M groupmembership -o USER={user}"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "AD Sites & Subnets"
  why: "netexec ldap -M subnets maps the AD sites/subnets — internal-network layout for pivoting. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M subnets"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "All DNS records (get-network)"
  why: "netexec ldap -M get-network dumps every DNS record + IP from the domain — host inventory without a zone transfer. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M get-network"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Kerberoastable accounts → TGS hashes"
  why: "netexec --kerberoasting requests TGS hashes for SPN-set accounts (crack offline). Enumeration of roastable users; same as GetUserSPNs. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' --kerberoasting kerberoast.txt"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "AS-REP-roastable accounts → AS-REP hashes"
  why: "netexec --asreproast finds accounts with pre-auth disabled and grabs their AS-REP hashes (crack offline). Same as GetNPUsers. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' --asreproast asrep.txt"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Pre-created (pre-2k) computer accounts"
  why: "netexec ldap -M pre2k finds pre-created computer accounts whose password equals the lowercased name — an easy foothold. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M pre2k"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Read a DACL (who can write to an object)"
  why: "netexec ldap -M daclread reads an object's DACL to find ACL-abuse edges (WriteDACL/GenericAll). Read-only (backup)."
  command: "netexec ldap {target} -u '{user}' -p '{password}' -M daclread -o TARGET={user} ACTION=read"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "BloodHound collection via netexec (LDAP)"
  why: "netexec ldap --bloodhound runs the collector over LDAP and drops the JSON zip for BloodHound — the map of the whole domain. Read-only."
  command: "netexec ldap {target} -u '{user}' -p '{password}' --bloodhound --collection All --dns-server {target}"
  requires: ["creds"]
# source: HTB AD Path/Active Directory Bloodhound

# --- LDAP search filters — AD attack-surface queries (HTB AD Path / AD LDAP) ----------------------
# {user}/{password}/{basedn} pre-fill from the profile + first credential. Read-only ldapsearch.
- description: "Accounts with password NOT required (PASSWD_NOTREQD)"
  why: "userAccountControl bit 32 — these accounts may have an EMPTY password; try a null bind/spray. Read-only enumeration."
  command: "ldapsearch -x -H ldap://{target} -D '{user}@{domain}' -w '{password}' -b '{basedn}' '(&(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=32))' sAMAccountName"
  requires: ["creds"]
# source: HTB AD Path/Active Directory LDAP

- description: "Unconstrained-delegation objects (TRUSTED_FOR_DELEGATION)"
  why: "UAC bit 524288 — hosts you can coerce a DC toward to steal its TGT. Read-only enumeration."
  command: "ldapsearch -x -H ldap://{target} -D '{user}@{domain}' -w '{password}' -b '{basedn}' '(userAccountControl:1.2.840.113556.1.4.803:=524288)' sAMAccountName dNSHostName"
  requires: ["creds"]
# source: HTB AD Path/Active Directory LDAP

- description: "Constrained-delegation objects (TRUSTED_TO_AUTH)"
  why: "UAC bit 16777216 — protocol-transition (S4U) delegation targets. Cross-check msDS-AllowedToDelegateTo. Read-only."
  command: "ldapsearch -x -H ldap://{target} -D '{user}@{domain}' -w '{password}' -b '{basedn}' '(userAccountControl:1.2.840.113556.1.4.803:=16777216)' sAMAccountName msDS-AllowedToDelegateTo"
  requires: ["creds"]
# source: HTB AD Path/Active Directory LDAP

- description: "Privileged accounts (adminCount=1)"
  why: "adminCount=1 marks accounts in/formerly-in protected groups (Domain/Enterprise Admins etc.) — the high-value targets. Read-only."
  command: "ldapsearch -x -H ldap://{target} -D '{user}@{domain}' -w '{password}' -b '{basedn}' '(&(objectClass=user)(adminCount=1))' sAMAccountName memberOf"
  requires: ["creds"]
# source: HTB AD Path/Active Directory LDAP

- description: "Disabled accounts (ACCOUNTDISABLE)"
  why: "userAccountControl bit 2 — filter these OUT of a spray list, or spot a re-enable target. Read-only enumeration."
  command: "ldapsearch -x -H ldap://{target} -D '{user}@{domain}' -w '{password}' -b '{basedn}' '(&(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=2))' sAMAccountName"
  requires: ["creds"]
# source: HTB AD Path/Active Directory LDAP

- description: "Domain trusts via LDAP (trustedDomain)"
  why: "Enumerate trust relationships as objects — flags/direction show cross-domain/forest attack paths. Read-only."
  command: "ldapsearch -x -H ldap://{target} -D '{user}@{domain}' -w '{password}' -b '{basedn}' '(objectClass=trustedDomain)' cn trustDirection trustAttributes flatName"
  requires: ["creds"]
# source: HTB AD Path/Active Directory LDAP

- description: "LAPS passwords readable via LDAP (ms-Mcs-AdmPwd)"
  why: "If your account can read ms-Mcs-AdmPwd, this dumps the LAPS local-admin password directly from LDAP — instant local admin. Read-only."
  command: "ldapsearch -x -H ldap://{target} -D '{user}@{domain}' -w '{password}' -b '{basedn}' '(ms-Mcs-AdmPwd=*)' sAMAccountName ms-Mcs-AdmPwd"
  requires: ["creds"]
# source: HTB AD Path/Active Directory LDAP
