# LDAP manual follow-ups (Tier-2 — shown, never auto-run; §11/§12). Anonymous (-x) enumeration is
# recon; authenticated queries reuse a credential the tool already collected (never a brute/list).
# {target}/{port} come from the profile; {basedn} is the discovered/entered base DN (validated
# before it reaches a command); {user}/{domain}/{password} come from creds.json when present.

- description: "Dump everything under the base DN (anonymous)"
  why: "Full anonymous directory read — the broadest single recon query"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=*)"'

- description: "List users (anonymous)"
  why: "Enumerate account names to feed SMB / Kerberos enumeration"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=user)" sAMAccountName'

- description: "List groups and members (anonymous)"
  why: "Map group membership — high-value AD recon"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=group)" cn member'

- description: "List computers / OS (anonymous)"
  why: "Enumerate domain-joined hosts and their OS for the target picture"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=computer)" dNSHostName operatingSystem'

- description: "Hunt for secrets in user description fields (anonymous)"
  why: "description/info attributes sometimes hold plaintext passwords — read-only recon"
  command: 'ldapsearch -x -H ldap://{target}:{port} -b "{basedn}" "(objectClass=user)" sAMAccountName description info'

- description: "Query over LDAPS (self-signed labs need LDAPTLS_REQCERT=never)"
  why: "Some DCs only answer on 636/TLS — set the env var in your terminal if the cert is self-signed"
  command: 'ldapsearch -x -H ldaps://{target}:636 -b "{basedn}" "(objectClass=*)"'

- description: "Authenticated bind with a collected credential (edit USER/DOMAIN/PASSWORD)"
  why: "Re-query as a known user (creds already gathered) — a single bind, not a brute force"
  command: 'ldapsearch -x -H ldap://{target}:{port} -D "USER@DOMAIN" -w PASSWORD -b "{basedn}" "(objectClass=user)" sAMAccountName'
  requires: ["creds"]

- description: "Dump AD-integrated DNS records over a null bind"
  why: "netexec ldap get-network reads AD DNS zones anonymously — read-only recon"
  command: "netexec ldap {target} -u '' -p '' -M get-network -o ALL=true"
# source: Obsidian: 0.00 Methdology/.../Active Directory Methdology/Full AD enum.md

- description: "Enumerate AdminSDHolder-protected accounts"
  why: "--admin-count lists high-value protected accounts — read-only recon"
  command: "netexec ldap {target} -u USER -p PASS --admin-count"
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../Active Directory Methdology/Full AD enum.md

- description: "All users with last-logon + pwdLastSet"
  why: "GetADUsers enumerates account metadata (enumeration script, no cracking)"
  command: "GetADUsers.py -all {domain}/USER:PASS -dc-ip {target}"
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../OSCP Random/445 SMB.md

- description: "Anonymous LDAP user enumeration (windapsearch)"
  why: "windapsearch lists users over an anonymous bind — read-only recon"
  command: "windapsearch --dc-ip {target} -u '' -U"
# source: Obsidian: 0.00 Methdology/.../Other Services/Other/389 _ LDAP.md

- description: "Dump AD to HTML/CSV over anonymous bind"
  why: "ldapdomaindump writes users/groups/computers/policy files — read-only recon"
  command: "ldapdomaindump ldap://{target}"
# source: Obsidian: 0.01 Cheatsheets/Impacket Tools.md

- description: "AS-REP-roastable accounts (DONT_REQ_PREAUTH) via LDAP filter"
  why: "Bitwise filter lists pre-auth-disabled accounts — read-only enum (no ticket request)"
  command: 'ldapsearch -x -H ldap://{target} -D USER@DOMAIN -w PASSWORD -b {basedn} "(&(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=4194304))" sAMAccountName'
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../Credentialed LDAP Enumeration.md

- description: "SPN-owning (kerberoastable) accounts via LDAP filter"
  why: "Lists accounts with a servicePrincipalName — read-only enum (no ticket request)"
  command: 'ldapsearch -x -H ldap://{target} -D USER@DOMAIN -w PASSWORD -b {basedn} "(&(objectClass=user)(servicePrincipalName=*))" sAMAccountName servicePrincipalName'
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../Credentialed LDAP Enumeration.md

- description: "Unconstrained-delegation accounts via LDAP filter"
  why: "Bitwise filter lists TRUSTED_FOR_DELEGATION accounts — read-only enum"
  command: 'ldapsearch -x -H ldap://{target} -D USER@DOMAIN -w PASSWORD -b {basedn} "(&(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=524288))" sAMAccountName'
  requires: ["creds"]
# source: Obsidian: 0.00 Methdology/.../Credentialed LDAP Enumeration.md

- description: "Enumerate AD Certificate Services (CAs + templates)"
  why: "netexec adcs module lists CAs / cert templates — read-only recon that surfaces ESC misconfigs"
  command: "netexec ldap {target} -u USER -p PASS -M adcs"
  requires: ["creds"]
# source: AD-toolkit eval (netexec ldap enum modules — read-only)

- description: "Read the machine account quota (MachineAccountQuota)"
  why: "netexec maq reads ms-DS-MachineAccountQuota — a read-only fact (>0 enables RBCD/add-computer paths)"
  command: "netexec ldap {target} -u USER -p PASS -M maq"
  requires: ["creds"]
# source: AD-toolkit eval (netexec ldap enum modules — read-only)

- description: "Check LDAP signing / channel-binding posture (null bind)"
  why: "netexec ldap-checker reports whether LDAP signing + channel binding are enforced — read-only relay-susceptibility recon, no attack"
  command: "netexec ldap {target} -u '' -p '' -M ldap-checker"
# source: AD-toolkit eval (netexec ldap enum modules — read-only)
