# SMB manual follow-ups (Tier-2 — shown, never auto-run; §11). Single-attempt default creds against
# well-known accounts, plus RPC/smbmap enumeration. NEVER Tier-3 (username/password LISTS, spraying).
# All commands are §2-allowed recon; placeholders {target} {share} {domain} filled from the profile.

- description: "Try administrator with empty password"
  why: "Single attempt against a well-known account — not a brute force"
  command: "netexec smb {target} -u 'administrator' -p '' --shares"

- description: "Try admin with empty password"
  why: "Single attempt — common misconfiguration check"
  command: "netexec smb {target} -u 'admin' -p '' --shares"

- description: "Default-cred sanity check (sa:sa)"
  why: "Single attempt against a well-known default"
  command: "netexec smb {target} -u 'sa' -p 'sa' --shares"

- description: "Try guest:guest"
  why: "Single attempt against the guest account with a default password"
  command: "netexec smb {target} -u 'guest' -p 'guest' --shares"

- description: "RID cycling via null session"
  why: "RID enumeration sometimes returns users SAMR/LDAP enum misses (recon, not brute)"
  command: "netexec smb {target} -u '' -p '' --rid-brute 10000"

- description: "RPC null session — domain groups"
  why: "enumdomgroups lists groups reachable over a null session"
  command: "rpcclient -U '' -N {target} -c 'enumdomgroups'"

- description: "RPC null session — user display info"
  why: "querydispinfo returns user details (full name, description)"
  command: "rpcclient -U '' -N {target} -c 'querydispinfo'"

- description: "RPC null session — server info"
  why: "srvinfo returns OS version and server type"
  command: "rpcclient -U '' -N {target} -c 'srvinfo'"

- description: "smbmap null session"
  why: "Alternate share + permission view over a null session"
  command: "smbmap -H {target}"

- description: "smbmap as guest"
  why: "Share + permission view as the guest account"
  command: "smbmap -H {target} -u guest -p ''"

- description: "Recursive listing of a readable share (fill in SHARE)"
  why: "Walk a readable share; bounded — deeper needs a second run"
  command: "smbclient //{target}/SHARE -N -c 'recurse ON; ls'"

- description: "SMB vuln NSE scripts"
  why: "Flag known SMB vulns (MS17-010, etc.) — enumeration/detection only"
  command: "nmap --script smb-vuln-* -p 445 {target}"

- description: "List domain users over a null session (SAMR)"
  why: "rpcclient enumdomusers over the null session enumerates users read-only"
  command: "rpcclient -U '' -N {target} -c 'enumdomusers'"
# source: Obsidian: 0.00 Methdology/.../Other Services/Other/135 _ RPC.md

- description: "List active SMB logon sessions (null)"
  why: "--sessions maps who is currently connected — read-only recon"
  command: "netexec smb {target} -u '' -p '' --sessions"
# source: Obsidian: 0.00 Methdology/.../Active Directory Methdology/Full AD enum.md

- description: "Enumerate every filename in a null-readable share"
  why: "--spider (edit SHARE) lists share contents recursively — read-only recon"
  command: "netexec smb {target} -u '' -p '' --spider SHARE --regex ."
# source: Obsidian: 0.00 Methdology/.../Active Directory Methdology/Full AD enum.md

- description: "SAMR users + groups dump over null session"
  why: "impacket-samrdump enumerates domain users/groups anonymously (read-only)"
  command: "impacket-samrdump {target}"
# source: Obsidian: 0.01 Cheatsheets/Impacket Tools.md

- description: "SID lookup + RID cycling over null session"
  why: "impacket-lookupsid resolves the domain SID and cycles RIDs to names (recon, like --rid-brute)"
  command: "impacket-lookupsid :@{target}"
# source: Obsidian: 0.00 Methdology/.../General impacket syntax/lookupsid.md

- description: "Domain password policy over null session"
  why: "rpcclient getdompwinfo reads the password policy anonymously — read-only recon"
  command: "rpcclient -U '' -N {target} -c getdompwinfo"
# source: Obsidian: 0.00 Methdology/.../OSCP Random/oncybersec.md

# --- CrackMapExec / netexec — credentialed AD enum (HTB AD Path) ----------------------------------
# {user}/{password} pre-fill from the first collected credential. All read-only enumeration.
- description: "Spider ALL readable shares (recursive file metadata)"
  why: "netexec -M spider_plus lists every file across all shares and saves JSON metadata — the fast way to find interesting files (configs, backups, .kdbx). Read-only."
  command: "netexec smb {target} -u '{user}' -p '{password}' -M spider_plus"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Spider shares AND download matched files"
  why: "spider_plus with DOWNLOAD_FLAG pulls the files it finds to ~/.nxc/modules/nxc_spider_plus/. Edit the pattern to target creds/configs. Read-only (download)."
  command: "netexec smb {target} -u '{user}' -p '{password}' -M spider_plus -o DOWNLOAD_FLAG=true EXCLUDE_DIR=IPC$"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Find files by name/regex in a share"
  why: "--spider <share> --regex hunts a share for matching filenames (passwords, config, unattend, web.config, .kdbx). Read-only recon."
  command: "netexec smb {target} -u '{user}' -p '{password}' --share SYSVOL --spider . --regex '(?i)(pass|cred|unattend|web\\.config|\\.kdbx)'"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "GPP passwords from SYSVOL (groups.xml)"
  why: "netexec -M gpp_password decrypts Group Policy Preferences cpassword blobs in SYSVOL to plaintext — a classic AD win. Read-only."
  command: "netexec smb {target} -u '{user}' -p '{password}' -M gpp_password"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "GPP autologon creds (registry.xml)"
  why: "netexec -M gpp_autologin finds autologon username/password pushed via GPP in SYSVOL. Read-only."
  command: "netexec smb {target} -u '{user}' -p '{password}' -M gpp_autologin"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Credentialed shares + users + pass-pol"
  why: "With a valid cred, list shares/perms, domain users, and the password policy in one credentialed sweep. Read-only."
  command: "netexec smb {target} -u '{user}' -p '{password}' --shares --users --pass-pol"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Logged-on users + sessions + disks"
  why: "Map where accounts are logged in (hunt for admin sessions) and enumerate sessions/disks. Read-only recon."
  command: "netexec smb {target} -u '{user}' -p '{password}' --loggedon-users --sessions --disks"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec

- description: "Active network connections on the host"
  why: "netexec smb -M get_netconnections lists the target's current TCP/UDP connections — maps who it talks to and internal services to pivot toward. Read-only."
  command: "netexec smb {target} -u '{user}' -p '{password}' -M get_netconnections"
  requires: ["creds"]
# source: HTB AD Path/Using CrackMapExec/Additional CME Functionality.md

- description: "Find SMB-signing-disabled hosts (relay targets)"
  why: "--gen-relay-list writes hosts with SMB signing OFF to a file — the target list for an NTLM relay. Edit {target} to a /24. Read-only enumeration."
  command: "netexec smb {target}/24 --gen-relay-list relay_targets.lst"
# source: HTB AD Path/Using CrackMapExec
