# Java RMI manual follow-ups (Tier-2 — shown, never auto-run). Read-only enum; {target}/{port} filled
# from the active profile. Invoking a remote method / deserialization exploitation is NOT wrapped.
- description: "Dump the RMI registry (re-run)"
  why: "rmi-dumpregistry in isolation re-lists the bound objects + endpoints — read-only"
  command: "nmap -sV -p {port} --script rmi-dumpregistry {target}"
# source: Obsidian: 0.01 Cheatsheets/All_In_One/oncybersec.md (Java RMI — rmi-dumpregistry)

- description: "Confirm the RMI/registry banner (-sV)"
  why: "a plain -sV confirms the RMI registry / JMX product + Java version — read-only"
  command: "nmap -sV -p {port} {target}"
# source: Obsidian: 0.01 Cheatsheets/All_In_One/oncybersec.md (Java RMI — rmi-dumpregistry)

- description: "Look up references for the RMI/JMX service (searchsploit, display-only)"
  why: "surfaces documented Java RMI/JMX issues to read — lookup only, never executed"
  command: "searchsploit java rmi"
# source: Obsidian: 0.01 Cheatsheets/All_In_One/oncybersec.md (Java RMI — rmi-dumpregistry)
