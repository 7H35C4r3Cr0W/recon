# mDNS manual follow-ups (Tier-2 — shown, never auto-run). Read-only enum; {target}/{port} filled
# from the active profile. mDNS is UDP and lossy, so a retry is often needed.
- description: "Service discovery (re-run, UDP)"
  why: "dns-service-discovery in isolation re-lists advertised services — read-only"
  command: "nmap -sU -p {port} --script dns-service-discovery {target}"
# source: HackTricks 5353-udp-multicast-dns-mdns (book.hacktricks.wiki) — standard OSCP mDNS recon

- description: "Broadcast DNS discovery (nmap NSE)"
  why: "broadcast-dns-service-discovery enumerates advertised services on the segment — read-only"
  command: "nmap --script broadcast-dns-service-discovery {target}"
# source: HackTricks 5353-udp-multicast-dns-mdns (book.hacktricks.wiki) — standard OSCP mDNS recon

- description: "Confirm the mDNS port (retry — UDP is lossy)"
  why: "a single UDP probe can be dropped; re-scan confirms 5353/udp is really open"
  command: "nmap -sU -p {port} --host-timeout 60s {target}"
# source: HackTricks 5353-udp-multicast-dns-mdns (book.hacktricks.wiki) — standard OSCP mDNS recon
