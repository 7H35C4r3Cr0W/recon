<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabu — What's New: Recon → Exploitation</title>
<style>
:root{
 --ink:#0f1420;--surface:#161d2b;--surface-2:#1b2434;--border:#2a3446;--text:#e6e9ef;
 --muted:#8a94a6;--gold:#c9a227;--gold-soft:rgba(201,162,39,.14);--teal:#5b8a8f;
 --teal-soft:rgba(91,138,143,.16);--red:#c8544f;--green:#5aa06a;--blue:#5b7fb0;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --mono:"JetBrains Mono","SF Mono","DejaVu Sans Mono",Consolas,monospace;}
:root[data-theme="light"]{--ink:#f2ede1;--surface:#fbf8f0;--surface-2:#f4efe2;--border:#ddd3bf;
 --text:#1f2633;--muted:#6b6656;--gold:#9a7415;--gold-soft:rgba(154,116,21,.12);--teal:#3f6f74;
 --teal-soft:rgba(63,111,116,.12);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);
 -webkit-font-smoothing:antialiased;overflow:hidden}
.deck{height:100vh;display:flex;flex-direction:column}
/* ---- top bar ---- */
.bar{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--border);
 background:var(--surface);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.owl{width:30px;height:30px;border-radius:8px;background:var(--gold-soft);border:1px solid var(--gold);
 display:grid;place-items:center;color:var(--gold);font-size:15px}
.brand .tag{color:var(--muted);font-weight:500;font-size:12.5px}
.bar .spacer{flex:1}
.bar button{background:var(--surface-2);color:var(--text);border:1px solid var(--border);
 border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar button:hover{border-color:var(--gold)}
.counter{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;min-width:52px;text-align:center}
/* ---- progress ---- */
.progress{height:3px;background:var(--border);flex:0 0 auto}
.progress > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
/* ---- stage ---- */
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:34px 6vw;display:flex;flex-direction:column;
 opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .4s ease,transform .4s ease;
 overflow:auto}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.eyebrow{color:var(--teal);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin-bottom:10px}
h1{font-family:var(--serif);font-size:clamp(30px,4.6vw,56px);line-height:1.06;margin:0 0 14px;font-weight:600}
h2{font-family:var(--serif);font-size:clamp(24px,3.2vw,40px);line-height:1.1;margin:0 0 8px;font-weight:600}
.lede{font-size:clamp(16px,1.6vw,21px);color:var(--muted);max-width:60ch;line-height:1.5;margin:0 0 18px}
.center{align-items:center;justify-content:center;text-align:center}
.center .lede{margin-left:auto;margin-right:auto}
b,strong{color:var(--text)}
.gold{color:var(--gold)}
.body{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;flex:1;min-height:0}
.body.wide-left{grid-template-columns:1.3fr 1fr}
.body.solo{grid-template-columns:1fr}
@media(max-width:920px){.body{grid-template-columns:1fr;gap:20px}}
ul.points{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
ul.points li{position:relative;padding-left:30px;font-size:clamp(15px,1.5vw,18px);line-height:1.45}
ul.points li::before{content:"";position:absolute;left:0;top:.42em;width:12px;height:12px;border-radius:3px;
 background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
ul.points li .h{color:var(--text);font-weight:700}
ul.points li small{color:var(--muted)}
.shot{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);
 box-shadow:0 18px 46px rgba(0,0,0,.4)}
.shot img{display:block;width:100%;height:auto}
.shot .cap{padding:8px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px;background:var(--surface-2)}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;max-width:960px;margin:8px auto 0}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 16px;text-align:center}
.stat .n{font-family:var(--serif);font-size:clamp(28px,4vw,44px);color:var(--gold);line-height:1;font-weight:600}
.stat .l{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.35}
/* chips grid */
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:70ch}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 13px;
 font-size:13.5px;color:var(--text)}
.chip.hot{border-color:var(--gold);color:var(--gold)}
.cat{margin-bottom:16px}
.cat h4{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
/* code block */
.code{font-family:var(--mono);font-size:13.5px;background:#0c111b;border:1px solid var(--border);
 border-radius:10px;padding:14px 16px;color:#dfe6f0;line-height:1.6;overflow:auto}
.code .c{color:var(--muted)}.code .k{color:var(--gold)}.code .s{color:var(--green)}
/* callout box */
.note{background:var(--teal-soft);border:1px solid var(--teal);border-left-width:4px;border-radius:10px;
 padding:16px 18px;font-size:15px;line-height:1.5;max-width:70ch}
.note.warn{background:var(--gold-soft);border-color:var(--gold)}
.note .t{display:block;font-weight:700;margin-bottom:5px;color:var(--text)}
/* legal grid */
.legal{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:900px}
@media(max-width:820px){.legal{grid-template-columns:1fr}}
.legal .box{border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--surface)}
.legal .box.yes{border-color:var(--green)}
.legal .box.no{border-color:var(--red)}
.legal .box h4{margin:0 0 10px;font-size:14px}
.legal .box.yes h4{color:var(--green)}.legal .box.no h4{color:var(--red)}
.legal .box ul{margin:0;padding-left:18px;line-height:1.6;font-size:14px;color:var(--muted)}
.legal .box ul b{color:var(--text)}
.kbd{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);
 border-radius:5px;padding:1px 6px}
.hintbar{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
/* big edge navigation arrows */
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:54px;height:54px;
 border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
 font-size:30px;line-height:1;font-family:var(--serif);display:grid;place-items:center;cursor:pointer;
 box-shadow:0 6px 20px rgba(0,0,0,.28);transition:opacity .2s,border-color .2s,color .2s,transform .12s}
.nav-arrow:hover{border-color:var(--gold);color:var(--gold)}
.nav-arrow:active{transform:translateY(-50%) scale(.94)}
.nav-arrow.left{left:20px}.nav-arrow.right{right:20px}
.nav-arrow span{transform:translateY(-2px)}
.nav-arrow:disabled{opacity:.25;cursor:default;pointer-events:none}
.nav-arrow:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:720px){.nav-arrow{width:44px;height:44px;font-size:24px}.nav-arrow.left{left:8px}.nav-arrow.right{right:8px}}
@media(prefers-reduced-motion:reduce){.nav-arrow{transition:none}}
/* topology svg */
.topo{width:100%;max-width:940px;margin:0 auto}
.topo text{font-family:var(--sans)}
</style>
</head>

/* ---- engine ---- */
const stage = document.getElementById("stage");
SLIDES.forEach((s,i)=>{
  const d=document.createElement("section");
  d.className="slide "+(s.cls||"");
  d.innerHTML=s.html+'<div class="hintbar">'+(i+1)+' / '+SLIDES.length+'</div>';
  stage.appendChild(d);
});
const slides=[...document.querySelectorAll(".slide")];
document.getElementById("tot").textContent=SLIDES.length;
let idx=0, timer=null;
const navPrev=document.getElementById("navPrev"), navNext=document.getElementById("navNext");
function show(n){
  idx=Math.max(0,Math.min(SLIDES.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle("active",i===idx));
  document.getElementById("cur").textContent=idx+1;
  document.getElementById("bar").style.width=((idx+1)/SLIDES.length*100)+"%";
  navPrev.disabled=idx===0; navNext.disabled=idx===SLIDES.length-1;
}
function nextSlide(){ if(idx<SLIDES.length-1) show(idx+1); else if(timer) stopAuto(); }
document.getElementById("next").onclick=()=>show(idx+1);
document.getElementById("prev").onclick=()=>show(idx-1);
navNext.onclick=()=>show(idx+1);
navPrev.onclick=()=>show(idx-1);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();show(idx+1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(idx-1);}
  else if(e.key==="Home")show(0); else if(e.key==="End")show(SLIDES.length-1);
  else if(e.key.toLowerCase()==="f"){ if(!document.fullscreenElement)document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
function startAuto(){ timer=setInterval(nextSlide,6500); document.getElementById("autoplay").textContent="⏸ Pause"; }
function stopAuto(){ clearInterval(timer); timer=null; document.getElementById("autoplay").textContent="▶ Autoplay"; }
document.getElementById("autoplay").onclick=()=>timer?stopAuto():startAuto();
const root=document.documentElement;
root.dataset.theme="dark";
document.getElementById("theme").onclick=()=>{ root.dataset.theme=root.dataset.theme==="dark"?"light":"dark"; };
show(0);
</script>
