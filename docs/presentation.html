<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabu — Recon → Exploitation, end to end</title>
<style>
:root{
 --ink:#0f1420;--surface:#161d2b;--surface-2:#1b2434;--border:#2a3446;--text:#e6e9ef;
 --muted:#8a94a6;--gold:#c9a227;--gold-soft:rgba(201,162,39,.14);--teal:#5b8a8f;
 --teal-soft:rgba(91,138,143,.16);--red:#c8544f;--green:#5aa06a;--blue:#5b7fb0;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --mono:"JetBrains Mono","SF Mono","DejaVu Sans Mono",Consolas,monospace;}
:root[data-theme="light"]{--ink:#f2ede1;--surface:#fbf8f0;--surface-2:#f4efe2;--border:#ddd3bf;
 --text:#1f2633;--muted:#6b6656;--gold:#9a7415;--gold-soft:rgba(154,116,21,.12);--teal:#3f6f74;
 --teal-soft:rgba(63,111,116,.12);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.deck{height:100vh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:9px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.owl{width:30px;height:30px;border-radius:8px;background:var(--gold-soft);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:15px}
.brand .tag{color:var(--muted);font-weight:500;font-size:12.5px}
.bar .spacer{flex:1}
.bar button{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar button:hover{border-color:var(--gold)}
.counter{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;min-width:56px;text-align:center}
.progress{height:3px;background:var(--border);flex:0 0 auto}
.progress > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:24px 5vw 42px;display:flex;flex-direction:column;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .4s ease,transform .4s ease;overflow:auto}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.eyebrow{color:var(--teal);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;margin-bottom:6px}
.eyebrow .new{color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 6px;margin-left:8px;font-size:10.5px}
h1{font-family:var(--serif);font-size:clamp(30px,4.4vw,54px);line-height:1.06;margin:0 0 14px;font-weight:600;text-wrap:balance}
h2{font-family:var(--serif);font-size:clamp(21px,2.8vw,34px);line-height:1.12;margin:0 0 6px;font-weight:600;text-wrap:balance}
.lede{font-size:clamp(15px,1.5vw,20px);color:var(--muted);max-width:62ch;line-height:1.5;margin:0 0 14px}
.center{align-items:center;justify-content:center;text-align:center}
.center .lede{margin-left:auto;margin-right:auto}
b,strong{color:var(--text)} .gold{color:var(--gold)}
.body{display:grid;grid-template-columns:1.5fr .92fr;gap:26px;align-items:center;flex:1;min-height:0}
.body.even{grid-template-columns:1.2fr .88fr}
@media(max-width:940px){.body{grid-template-columns:1fr;gap:16px}}
.showcase{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;align-items:center}
.showcase .shot{max-width:min(100%,1140px)}
.showcase .shot img{max-height:58vh;width:auto;max-width:100%}
.showcase.hero .shot{max-width:min(100%,1360px)}
.showcase.hero .shot img{max-height:72vh}
.prow{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1080px}
.prow .p{flex:1 1 210px;max-width:330px}
.prow .p .h{color:var(--gold);font-weight:700;display:block;margin-bottom:2px;font-size:14.5px}
.prow .p small{color:var(--muted);font-size:13px;line-height:1.42}
.shot{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 16px 42px rgba(0,0,0,.42)}
.shot img{display:block;width:100%;height:auto}
.body .shot img{max-height:63vh;object-fit:contain}
.shot .cap{padding:7px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px;background:var(--surface-2)}
ul.points{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
ul.points li{position:relative;padding-left:28px;font-size:clamp(14px,1.42vw,17px);line-height:1.4}
ul.points li::before{content:"";position:absolute;left:0;top:.42em;width:11px;height:11px;border-radius:3px;background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
ul.points li .h{color:var(--text);font-weight:700} ul.points li small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;max-width:940px;margin:6px auto 0}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 14px;text-align:center}
.stat .n{font-family:var(--serif);font-size:clamp(26px,3.6vw,40px);color:var(--gold);line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:7px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:7px;max-width:60ch}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text)}
.chip.hot{border-color:var(--gold);color:var(--gold)}
.note{background:var(--teal-soft);border:1px solid var(--teal);border-left-width:4px;border-radius:10px;padding:14px 16px;font-size:14.5px;line-height:1.5;max-width:64ch}
.note.warn{background:var(--gold-soft);border-color:var(--gold)}
.note .t{display:block;font-weight:700;margin-bottom:4px;color:var(--text)}
.legal{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.legal .box{border:1px solid var(--border);border-radius:11px;padding:12px 14px;background:var(--surface)}
.legal .box.yes{border-color:var(--green)} .legal .box.no{border-color:var(--red)}
.legal .box h4{margin:0 0 7px;font-size:13px} .legal .box.yes h4{color:var(--green)} .legal .box.no h4{color:var(--red)}
.legal .box ul{margin:0;padding-left:16px;line-height:1.5;font-size:12.5px;color:var(--muted)}
.legal .box ul b{color:var(--text)}
.tier{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px}
.tier .b{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:6px;border:1px solid;margin-top:2px}
.tier .b.a{color:var(--green);border-color:var(--green)}.tier .b.s{color:var(--gold);border-color:var(--gold)}.tier .b.o{color:var(--red);border-color:var(--red)}
.tier .d{font-size:14px;line-height:1.4} .tier .d b{color:var(--text)} .tier .d small{color:var(--muted)}
.steps{list-style:none;counter-reset:st;padding:0;margin:0;display:flex;flex-direction:column;gap:13px}
.steps li{counter-increment:st;position:relative;padding-left:40px;font-size:15px;line-height:1.4}
.steps li::before{content:counter(st);position:absolute;left:0;top:-1px;width:27px;height:27px;border-radius:50%;background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);font-weight:700;font-size:13.5px;display:grid;place-items:center}
.steps li b{color:var(--text)} .steps li .where{color:var(--teal);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-left:6px}
.steps code{font-family:var(--mono);font-size:12.5px;background:#0b0f18;border:1px solid var(--border);border-radius:6px;padding:3px 8px;color:#e2e9f2;display:block;margin-top:5px;overflow-x:auto;white-space:nowrap}
.steps code .g{color:var(--green)} .steps code .m{color:var(--muted)}
.helper{width:100%;max-width:1200px;margin:0 auto}
.helper .hd{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
.helper .fld{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-size:13px}
.helper .fld b{color:var(--muted);font-weight:600;margin-right:7px}
.helper .fld code{font-family:var(--mono);color:var(--text)}
.stepcards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:900px){.stepcards{grid-template-columns:minmax(0,1fr)}}
.stepcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px 17px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.28);min-width:0}
.stepcard .num{position:absolute;left:-12px;top:-12px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1a1200;font-weight:800;font-size:15px;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.stepcard h4{margin:0 0 9px;font-size:15.5px}
.stepcard h4 .where{color:var(--teal);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-left:9px}
.stepcard code{font-family:var(--mono);font-size:12.5px;background:#0b0f18;border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:#e2e9f2;display:block;overflow-x:auto;white-space:nowrap;line-height:1.5}
.stepcard code .g{color:var(--green)} .stepcard code .m{color:var(--muted)}
.stepcard .copy{position:absolute;top:14px;right:14px;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 9px;background:var(--surface-2)}
.term{font-family:var(--mono);font-size:13px;background:#0b0f18;border:1px solid var(--border);border-radius:10px;padding:15px 17px;line-height:1.55;overflow:auto;box-shadow:0 16px 42px rgba(0,0,0,.42);width:100%}
.term .c{color:var(--teal)} .term .pr{color:var(--gold)} .term .g{color:var(--green)} .term .m{color:var(--muted)}
.kbd{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.hintbar{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:52px;height:52px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:30px;line-height:1;font-family:var(--serif);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:opacity .2s,border-color .2s,color .2s,transform .12s}
.nav-arrow:hover{border-color:var(--gold);color:var(--gold)}
.nav-arrow:active{transform:translateY(-50%) scale(.94)}
.nav-arrow.left{left:18px}.nav-arrow.right{right:18px}
.nav-arrow span{transform:translateY(-2px)}
.nav-arrow:disabled{opacity:.22;cursor:default;pointer-events:none}
.nav-arrow:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:720px){.nav-arrow{width:42px;height:42px;font-size:24px}.nav-arrow.left{left:6px}.nav-arrow.right{right:6px}}
@media(prefers-reduced-motion:reduce){.slide,.nav-arrow,.progress>i{transition:none}}
</style>
</head>
<body>
<div class="deck">
  <div class="bar">
    <div class="brand"><span class="owl">{o,o}</span><div>Nabu — <span class="tag">Local Recon &amp; Exploitation Workspace</span></div></div>
    <div class="spacer"></div>
    <button id="autoplay" type="button">▶ Autoplay</button>
    <button id="theme" type="button">◐ Theme</button>
    <span class="counter"><span id="cur">1</span> / <span id="tot">21</span></span>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="stage" id="stage">
    <button class="nav-arrow left" id="navPrev" type="button" aria-label="Previous slide"><span>‹</span></button>
    <button class="nav-arrow right" id="navNext" type="button" aria-label="Next slide"><span>›</span></button>
  </div>
</div>

<script>
"use strict";
const S = (name, alt) => `<div class="shot"><img src="screenshots/${name}" alt="${alt}" loading="lazy">`;

const SLIDES = [
  // 1 — cover
  {cls:"center", html:`
    <div class="eyebrow">A guided showcase · updated July 2026</div>
    <h1>Nabu, end to end:<br><span class="gold">recon → exploitation.</span></h1>
    <p class="lede">One local workspace that discovers a box, enumerates every service, maps the attack
      surface, pivots across internal networks — and now <b>attacks</b>, one human-confirmed command at a
      time. Exam-legal by default, offline, no AI.</p>
    <p class="lede" style="font-size:14px">21 slides · click the <span class="gold">‹ ›</span> arrows or use
      <span class="kbd">→</span>/<span class="kbd">←</span> · <span class="kbd">F</span> fullscreen · <span class="kbd">▶</span> autoplay</p>`},

  // 2 — workspace dashboard
  {cls:"", html:`
    <div class="eyebrow">Start · the workspace</div>
    <h2>Every box is a self-contained project.</h2>
    <div class="body even">
      ${S("dashboard-empty.png","The workspace dashboard")}<div class="cap">Workspace · a searchable, filterable table of every engagement</div></div>
      <ul class="points">
        <li><span class="h">One folder per box.</span> <small>Services, findings, creds, notes, graph, report — reopen it and the whole state comes back.</small></li>
        <li><span class="h">Find it fast.</span> <small>Search and filter by name, IP, platform or status; open-by-IP when you forget the name.</small></li>
        <li><span class="h">Safe to run many.</span> <small>Profile locks + stale-lock recovery; a second window opens read-only.</small></li>
        <li><span class="h">Portable.</span> <small>Import / export a project as a <span class="kbd">.tar.gz</span> to move it between machines.</small></li>
      </ul>
    </div>`},

  // 3 — three-pane workspace
  {cls:"", html:`
    <div class="eyebrow">The workspace</div>
    <h2>Everything for one box, in one window.</h2>
    <div class="showcase hero">
      ${S("shell-dark.png","Nabu's three-pane recon workspace")}<div class="cap">Recon tab · service tree (left) · command builder (middle) · live HackTricks &amp; Exploit-DB (right)</div></div>
      <div class="prow">
        <div class="p"><span class="h">Left: your services.</span><small>Every open port, TCP + UDP — click to drive its module.</small></div>
        <div class="p"><span class="h">Middle: the command builder.</span><small>Dropdowns &amp; sliders build the exact command — you press Run.</small></div>
        <div class="p"><span class="h">Right: references, offline.</span><small>The matching HackTricks page + a version-aware Exploit-DB lookup.</small></div>
        <div class="p"><span class="h">Rail: the whole workflow.</span><small>Workspace · Recon · Graph · Findings · Credentials · Notes · Report.</small></div>
      </div>
    </div>`},

  // 4 — discover
  {cls:"", html:`
    <div class="eyebrow">Discover</div>
    <h2>Staged nmap → every port, versioned.</h2>
    <div class="body even">
      ${S("services-breadth.png","The discovered-services tree")}<div class="cap">Service tree · TCP + UDP, product &amp; version, non-standard ports included</div></div>
      <ul class="points">
        <li><span class="h">One split-button, your call.</span> <small>Quick / Default / Full / Exam — or a custom scan with full nmap-flag control.</small></li>
        <li><span class="h">TCP top-1000 → full → UDP → versioned.</span> <small>A <span class="kbd">-sCV</span> pass on exactly the ports that were found.</small></li>
        <li><span class="h">Non-standard ports match too.</span> <small>http on 8080 or 65000 still routes to the web module.</small></li>
        <li><span class="h">Discovery only.</span> <small>Nothing invasive runs here — this is just the map.</small></li>
      </ul>
    </div>`},

  // 5 — HTTP per-service builder
  {cls:"", html:`
    <div class="eyebrow">Enumerate · per service</div>
    <h2>Each service, its own module — granular.</h2>
    <div class="body even">
      ${S("http-panel.png","The HTTP module command builder")}<div class="cap">HTTP module · feroxbuster with a live command preview (port-80 content discovery)</div></div>
      <ul class="points">
        <li><span class="h">Build it with dropdowns.</span> <small>Wordlist, extensions, threads, depth, status codes — the exact command, previewed.</small></li>
        <li><span class="h">Reproduce any tool.</span> <small>Swap feroxbuster → gobuster / ffuf / dirsearch; the flags translate.</small></li>
        <li><span class="h">Non-standard HTTP ports.</span> <small>Every http-flagged port gets its own node and output subtree.</small></li>
        <li><span class="h">Copy or Run.</span> <small>Dry-run to preview, Run to execute, Add-to-report to keep it.</small></li>
      </ul>
    </div>`},

  // 6 — SMB tiered recon (the safety model)
  {cls:"", html:`
    <div class="eyebrow">Enumerate · the safety model</div>
    <h2>Three tiers, clearly separated.</h2>
    <div class="body">
      ${S("smb-tool-panel.png","The SMB tiered-recon panel")}<div class="cap">SMB · one click runs the full Tier-1 recon; Tier-2 waits for you; Tier-3 stays off</div></div>
      <div>
        <div class="tier"><span class="b a">Auto</span><div class="d"><b>Read-only enumeration.</b> <small>Null session, guest, shares, users, RID cycling — runs on one click, streams to files.</small></div></div>
        <div class="tier"><span class="b s">Shown</span><div class="d"><b>Single default-cred checks.</b> <small><span class="kbd">administrator:''</span>, <span class="kbd">sa:sa</span> — pre-filled in Manual Follow-ups; <b>you</b> click Run.</small></div></div>
        <div class="tier"><span class="b o">Opt-in</span><div class="d"><b>List-driven spraying.</b> <small>Off by default; enabled only in Spray mode, against your own target.</small></div></div>
        <p class="lede" style="font-size:14px;margin:6px 0 0">Anonymous / null-session wins auto-record to the credential vault.</p>
      </div>
    </div>`},

  // 7 — references offline
  {cls:"", html:`
    <div class="eyebrow">Reference · offline-first</div>
    <h2>HackTricks &amp; Exploit-DB, right beside the service.</h2>
    <div class="body even">
      ${S("reference-offline.png","The offline reference pane")}<div class="cap">Reference pane · the mapped HackTricks page, bundled offline · version-aware searchsploit</div></div>
      <ul class="points">
        <li><span class="h">Works with no internet.</span> <small>A build-time HackTricks snapshot is bundled; an optional live copy caches for later.</small></li>
        <li><span class="h">Finding-aware.</span> <small>Jumps to the section that matches what was actually found on the box.</small></li>
        <li><span class="h">Version-aware Exploit-DB.</span> <small>searchsploit by product + <span class="kbd">major.minor</span>, matched hits ranked first, capped with an "N of M" note.</small></li>
        <li><span class="h">Lookup only.</span> <small>Exploit-DB is never downloaded, transformed, or run — a pointer to read.</small></li>
      </ul>
    </div>`},

  // 8 — findings
  {cls:"", html:`
    <div class="eyebrow">Analyze · findings</div>
    <h2>Structured findings — never over-claimed.</h2>
    <div class="body even">
      ${S("findings.png","The findings view")}<div class="cap">Findings · parsed facts with a conservative severity — an open port is never a "vuln"</div></div>
      <ul class="points">
        <li><span class="h">Facts, not raw text.</span> <small>Users, shares, versions, misconfigs — parsed into structured findings.</small></li>
        <li><span class="h">Conservative by design.</span> <small>Only real weak postures (null session, SMB signing off) are flagged notable.</small></li>
        <li><span class="h">Visible failures.</span> <small>A blocked/missing tool says <span class="kbd">⚠ step did not run</span> — never a silent gap.</small></li>
        <li><span class="h">Sourced next steps.</span> <small>A pattern library suggests recon moves, each cited from a real box — pre-fill only.</small></li>
      </ul>
    </div>`},

  // 9 — credential vault + spray
  {cls:"", html:`
    <div class="eyebrow">Credentials</div>
    <h2>One vault feeds everything.</h2>
    <div class="body even">
      ${S("credential-vault.png","The credential vault dialog")}<div class="cap">Credential vault · <span class="kbd">creds.json</span> at 0600 — every module and attack draws from it</div></div>
      <ul class="points">
        <li><span class="h">Durable &amp; local.</span> <small>Stored at mode 0600; anonymous wins auto-record; secrets redacted in recon reports.</small></li>
        <li><span class="h">Consumed everywhere.</span> <small>LDAP, WinRM, MSSQL and the Exploitation tab pre-fill from it — no re-typing.</small></li>
        <li><span class="h">OSCP-legal spraying, opt-in.</span> <small>hydra / netexec across SMB·SSH·FTP·WinRM — off by default, target-scoped, you confirm.</small></li>
        <li><span class="h">Loot writes back.</span> <small>Dumped hashes/creds from the Exploitation tab land here for the next move.</small></li>
      </ul>
    </div>`},

  // 10 — attack surface graph
  {cls:"", html:`
    <div class="eyebrow">Present · the graph</div>
    <h2>The whole box as one map.</h2>
    <div class="showcase">
      ${S("graph.png","BloodHound-style attack-surface graph")}<div class="cap">Attack-surface graph · target → services → findings → credentials (secrets redacted)</div></div>
      <div class="prow">
        <div class="p"><span class="h">BloodHound-style.</span><small>Every relationship is a visible line; icon nodes with status &amp; note glyphs.</small></div>
        <div class="p"><span class="h">Notable stands out.</span><small>A red ring marks weak postures (here, SMB signing disabled).</small></div>
        <div class="p"><span class="h">Loot connected.</span><small>Credentials link back to where they were found — secrets never shown.</small></div>
      </div>
    </div>`},

  // 11 — LIGOLO pivot steps
  {cls:"", html:`
    <div class="eyebrow">Pivot · ligolo-ng</div>
    <h2>Reach an internal network — Nabu builds the steps.</h2>

const stage = document.getElementById("stage");
SLIDES.forEach((s,i)=>{
  const d=document.createElement("section");
  d.className="slide "+(s.cls||"");
  d.innerHTML=s.html+'<div class="hintbar">'+(i+1)+' / '+SLIDES.length+'</div>';
  stage.appendChild(d);
});
const slides=[...document.querySelectorAll(".slide")];
document.getElementById("tot").textContent=SLIDES.length;
let idx=0, timer=null;
const navPrev=document.getElementById("navPrev"), navNext=document.getElementById("navNext");
function show(n){
  idx=Math.max(0,Math.min(SLIDES.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle("active",i===idx));
  document.getElementById("cur").textContent=idx+1;
  document.getElementById("bar").style.width=((idx+1)/SLIDES.length*100)+"%";
  navPrev.disabled=idx===0; navNext.disabled=idx===SLIDES.length-1;
}
function nextSlide(){ if(idx<SLIDES.length-1) show(idx+1); else if(timer) stopAuto(); }
navNext.onclick=()=>show(idx+1); navPrev.onclick=()=>show(idx-1);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();show(idx+1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(idx-1);}
  else if(e.key==="Home")show(0); else if(e.key==="End")show(SLIDES.length-1);
  else if(e.key.toLowerCase()==="f"){ if(!document.fullscreenElement)document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
function startAuto(){ timer=setInterval(nextSlide,7000); document.getElementById("autoplay").textContent="⏸ Pause"; }
function stopAuto(){ clearInterval(timer); timer=null; document.getElementById("autoplay").textContent="▶ Autoplay"; }
document.getElementById("autoplay").onclick=()=>timer?stopAuto():startAuto();
const root=document.documentElement; root.dataset.theme="dark";
document.getElementById("theme").onclick=()=>{ root.dataset.theme=root.dataset.theme==="dark"?"light":"dark"; };
show(0);
</script>
