<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Segoe UI',system-ui,sans-serif">
  <!-- Dark-theme illustration of Nabu's BloodHound-style attack-surface graph (the live view is
       interactive Cytoscape.js). Node colours match the app: target blue, TCP light-blue, UDP green,
       finding yellow, exploit-db reference lavender, credential red; the red double ring = notable.
       Background/edges/legend are dark so it sits cleanly inside the dark deck. -->
  <rect width="940" height="560" fill="#111827"/>
  <g stroke="#3b4658" stroke-width="1.8" fill="none">
    <line x1="470" y1="92" x2="180" y2="176"/><line x1="470" y1="92" x2="373" y2="176"/>
    <line x1="470" y1="92" x2="567" y2="176"/><line x1="470" y1="92" x2="760" y2="176"/>
    <line x1="180" y1="212" x2="120" y2="300"/><line x1="180" y1="212" x2="285" y2="300"/>
    <line x1="567" y1="212" x2="567" y2="300"/>
    <line x1="760" y1="212" x2="770" y2="300"/>
  </g>
  <line x1="470" y1="92" x2="815" y2="410" stroke="#e0705f" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="567" y1="336" x2="800" y2="392" stroke="#b79ae6" stroke-width="1.8" stroke-dasharray="2 4"/>

  <!-- target -->
  <ellipse cx="470" cy="66" rx="96" ry="30" fill="#3457bf" stroke="#6d8fe0" stroke-width="1.5"/>
  <text x="470" y="62" fill="#eef2ff" font-size="14" font-weight="600" text-anchor="middle">10.10.10.100</text>
  <text x="470" y="79" fill="#c2ccf0" font-size="11" text-anchor="middle">demo.local</text>

  <!-- services -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <g>
      <rect x="128" y="176" width="104" height="36" rx="9" fill="#8fb6f2" stroke="#4a7fb5" stroke-width="1.3"/>
      <text x="180" y="199" fill="#0f2038">22/tcp · ssh</text>
    </g>
    <g>
      <rect x="317" y="176" width="112" height="36" rx="9" fill="#8fb6f2" stroke="#4a7fb5" stroke-width="1.3"/>
      <text x="373" y="199" fill="#0f2038">80/tcp · http</text>
    </g>
    <g>
      <rect x="503" y="176" width="128" height="36" rx="9" fill="#8fb6f2" stroke="#4a7fb5" stroke-width="1.3"/>
      <text x="567" y="199" fill="#0f2038">445/tcp · smb</text>
    </g>
    <g>
      <rect x="702" y="176" width="116" height="36" rx="9" fill="#8fd39a" stroke="#4f8a5f" stroke-width="1.3"/>
      <text x="760" y="199" fill="#0f2810">161/udp · snmp</text>
    </g>
  </g>

  <!-- findings + reference + credential -->
  <g font-size="11.5" text-anchor="middle">
    <g>
      <rect x="60" y="300" width="120" height="34" rx="8" fill="#f2d98a" stroke="#c9a227" stroke-width="1.3"/>
      <text x="120" y="322" fill="#3a2f0a">product: OpenSSH</text>
    </g>
    <g>
      <rect x="221" y="300" width="128" height="34" rx="8" fill="#cbb1ee" stroke="#8f6fc0" stroke-width="1.3"/>
      <text x="285" y="322" fill="#2c1e46">ref: EDB-45210</text>
    </g>
    <!-- notable finding: red double ring -->
    <g>
      <rect x="496" y="298" width="142" height="38" rx="9" fill="#f2d98a" stroke="#e0705f" stroke-width="4"/>
      <rect x="500" y="302" width="134" height="30" rx="7" fill="none" stroke="#e0705f" stroke-width="1.5"/>
      <text x="567" y="321" fill="#3a2f0a" font-weight="600">signing: disabled</text>
    </g>
    <g>
      <rect x="712" y="300" width="116" height="34" rx="8" fill="#f2d98a" stroke="#c9a227" stroke-width="1.3"/>
      <text x="770" y="322" fill="#3a2f0a">community: public</text>
    </g>
    <!-- credential (redacted) -->
    <g>
      <rect x="742" y="392" width="146" height="38" rx="9" fill="#e88b9c" stroke="#c0564b" stroke-width="1.3"/>
      <text x="815" y="410" fill="#3a0d14" font-size="12" font-weight="600">svc_backup</text>
      <text x="815" y="424" fill="#6b1f2a" font-size="10">secret &lt;redacted&gt;</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#aab3c2">
    <rect x="34" y="500" width="872" height="30" rx="8" fill="#1b2434" stroke="#2a3446"/>
    <circle cx="60" cy="515" r="6" fill="#3457bf"/><text x="72" y="519">target</text>
    <rect x="150" y="509" width="12" height="12" rx="3" fill="#8fb6f2" stroke="#4a7fb5"/><text x="168" y="519">service (TCP)</text>
    <rect x="272" y="509" width="12" height="12" rx="3" fill="#8fd39a" stroke="#4f8a5f"/><text x="290" y="519">UDP</text>
    <rect x="340" y="509" width="12" height="12" rx="3" fill="#f2d98a" stroke="#c9a227"/><text x="358" y="519">finding</text>
    <rect x="428" y="509" width="12" height="12" rx="3" fill="#cbb1ee" stroke="#8f6fc0"/><text x="446" y="519">exploit-db reference</text>
    <rect x="588" y="509" width="12" height="12" rx="3" fill="#e88b9c" stroke="#c0564b"/><text x="606" y="519">credential (redacted)</text>
    <rect x="758" y="507" width="14" height="14" rx="3" fill="none" stroke="#e0705f" stroke-width="2.5"/>
    <text x="780" y="519">notable</text>
  </g>
</svg>
