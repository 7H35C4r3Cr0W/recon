<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabu — a guided tour</title>
<style>
:root{
 --ink:#0f1420;--surface:#161d2b;--surface-2:#1b2434;--border:#2a3446;--text:#e6e9ef;
 --muted:#8a94a6;--gold:#c9a227;--gold-soft:rgba(201,162,39,.14);--teal:#5b8a8f;
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 --mono:"JetBrains Mono","SF Mono","DejaVu Sans Mono",Consolas,monospace;}
@media (prefers-color-scheme:light){:root{
 --ink:#f2ede1;--surface:#fbf8f0;--surface-2:#f4efe2;--border:#ddd3bf;--text:#1f2633;
 --muted:#6b6656;--gold:#9a7415;--gold-soft:rgba(154,116,21,.12);--teal:#3f6f74;}}
:root[data-theme="dark"]{--ink:#0f1420;--surface:#161d2b;--surface-2:#1b2434;--border:#2a3446;
 --text:#e6e9ef;--muted:#8a94a6;--gold:#c9a227;--gold-soft:rgba(201,162,39,.14);--teal:#5b8a8f;}
:root[data-theme="light"]{--ink:#f2ede1;--surface:#fbf8f0;--surface-2:#f4efe2;--border:#ddd3bf;
 --text:#1f2633;--muted:#6b6656;--gold:#9a7415;--gold-soft:rgba(154,116,21,.12);--teal:#3f6f74;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--ink);color:var(--text);overflow:hidden}
.deck{height:100vh;display:flex;flex-direction:column;
 background-image:radial-gradient(1100px 560px at 88% -10%,var(--gold-soft),transparent 60%)}
.bar{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--border)}
.bar svg{width:30px;height:30px}.bar .nm{font-family:var(--serif);font-weight:600;font-size:18px}
.bar .tag{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.bar .sp{flex:1}
.count{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.tbtn{font-family:var(--sans);font-size:12.5px;color:var(--text);background:var(--surface);
 border:1px solid var(--border);border-radius:8px;padding:6px 11px;cursor:pointer;margin-left:10px}
.tbtn:hover{border-color:var(--gold)}.tbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 40px;overflow:hidden}
.slide{width:100%;max-width:1080px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
h1{font-family:var(--serif);font-weight:600;line-height:1.05;text-wrap:balance;margin:0 0 14px}
.slide h1{font-size:clamp(26px,4vw,44px)}
.lead{font-size:clamp(15px,1.6vw,19px);color:var(--text);max-width:64ch;margin:0 0 16px;line-height:1.5}
ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-width:70ch}
li{position:relative;padding-left:22px;color:var(--text);font-size:15px}
li::before{content:"";position:absolute;left:2px;top:8px;width:8px;height:8px;border-radius:2px;background:var(--gold)}
.title-slide{text-align:center;max-width:40ch;margin:0 auto}
.title-slide h1{font-size:clamp(40px,7vw,74px)}.title-slide .lead{margin:0 auto 18px}
.title-slide ul{align-items:center}.title-slide li{padding-left:0}.title-slide li::before{display:none}
.title-slide li{color:var(--muted);font-family:var(--mono);font-size:13px}
.imgwrap{display:grid;grid-template-columns:1.35fr 1fr;gap:30px;align-items:center}
.imgwrap.split{grid-template-columns:1fr}
figure{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;
 padding:12px;box-shadow:0 16px 44px rgba(0,0,0,.28)}
figure img{width:100%;display:block;border-radius:8px;border:1px solid var(--border)}
figcaption{color:var(--muted);font-size:12px;margin-top:9px;text-align:center;font-family:var(--mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.imgwrap{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
.foot{display:flex;align-items:center;gap:14px;padding:14px 26px;border-top:1px solid var(--border)}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border);border:none;padding:0;cursor:pointer}
.dot[aria-current="true"]{background:var(--gold)}
.dot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav{font-family:var(--sans);font-size:14px;color:var(--text);background:var(--surface);
 border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer}
.nav:hover{border-color:var(--gold)}.nav:disabled{opacity:.4;cursor:default}
.nav:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
.brand .m-tile{fill:var(--surface);stroke:var(--gold);stroke-opacity:.4;stroke-width:2}
.brand .m-gold{fill:var(--gold)}.brand .m-teal-f{fill:var(--teal)}.brand .m-teal-s{stroke:var(--teal);fill:none}
</style>
</head>
<body>
<div class="deck">
 <div class="bar">
  <svg class="brand" viewBox="0 0 256 256" aria-hidden="true">
   <rect class="m-tile" x="8" y="8" width="240" height="240" rx="52"/>
   <path class="m-gold" d="M128 40 L142 66 L128 60 L114 66 Z"/><rect class="m-gold" x="125" y="60" width="6" height="20" rx="3"/>
   <g class="m-teal-s" stroke-width="7" stroke-linecap="round"><line x1="128" y1="140" x2="76" y2="100"/>
   <line x1="128" y1="140" x2="188" y2="108"/><line x1="128" y1="140" x2="112" y2="200"/><line x1="188" y1="108" x2="112" y2="200"/></g>
   <circle class="m-gold" cx="128" cy="140" r="17"/><circle class="m-teal-f" cx="76" cy="100" r="11"/>
   <circle class="m-teal-f" cx="188" cy="108" r="11"/><circle class="m-teal-f" cx="112" cy="200" r="11"/>
  </svg>
  <div><div class="nm">Nabu</div><div class="tag">Guided tour</div></div>
  <div class="sp"></div>
  <span class="count" id="count"></span>
  <button class="tbtn" id="theme" type="button">◐ Theme</button>
 </div>
 <div class="stage"><div class="slide" id="slide"></div></div>
 <div class="foot">
  <div class="dots" id="dots"></div>
  <button class="nav" id="prev" type="button">← Back</button>
  <button class="nav primary" id="next" type="button">Next →</button>
 </div>
</div>

const SLIDES=[{"kind": "title", "title": "Nabu", "eyebrow": "A guided tour", "body": "The local reconnaissance workspace for OSCP prep and exam day. This deck walks a real session — launch to report.", "bullets": ["Recon-only by default", "Runs offline", "Exam-legal, no exploitation"]}, {"kind": "text", "eyebrow": "Overview", "title": "What Nabu is", "body": "Nabu wraps the standard enumeration tools you already use (nmap, feroxbuster, smbclient, netexec, enum4linux-ng…) behind one calm desktop workspace. It runs them safely, structures what they find, links each service to HackTricks and Exploit-DB, draws an attack-surface graph, and writes an Obsidian-ready report.", "bullets": ["One self-contained project folder per box", "Every command passes a compliance safety-gate", "Credentials stay masked and local — never exposed", "No exploitation, no brute-force, no AI at runtime (all opt-in / off)"]}, {"kind": "text", "eyebrow": "The pipeline", "title": "How a session flows", "body": "The same shape every time — you stay in control at every step; nothing runs itself.", "bullets": ["1 · Launch → workspace", "2 · New project → enter the target IP", "3 · nmap discovers ports & services", "4 · Each service routes to its module", "5 · Safe per-service recon (Auto / Shown / opt-in Spray)", "6 · Findings parsed & conservatively classified", "7 · References, graph, and a full report"]}, {"kind": "image", "eyebrow": "Step 1 — Launch", "title": "Your workspace", "body": "Nabu opens offline to the workspace dashboard — every project you've worked, searchable and filterable. First run, it's an invitation to start.", "image": "dashboard-empty.png", "caption": "Workspace dashboard — empty state"}, {"kind": "image", "eyebrow": "Step 2 — New project", "title": "Enter the target", "body": "Type the target IP (and an optional hostname / box name). Nabu creates a self-contained project folder that will hold everything for this box — reopen it later and the whole state comes back.", "image": "new-project.png", "caption": "New Project dialog"}, {"kind": "image", "eyebrow": "The shell", "title": "One workspace, three panes", "body": "A primary nav rail on the left (Workspace · Recon · Graph · Findings · Credentials · Notes · Report · Activity), a compact header showing the project and target, and the three-pane recon view: services, tools, and references.", "image": "shell-light.png", "caption": "The main application shell"}, {"kind": "image", "eyebrow": "Step 3 — Discovery", "title": "Ports & services (nmap)", "body": "One click runs nmap in stages — fast top-1000 TCP, full sweep, versioned scan on what's open, and a UDP pass. Discovered services fill the tree; TCP reads blue, UDP green.", "image": "shell-light.png", "caption": "Discovered services in the tree (left pane)"}, {"kind": "image", "eyebrow": "Step 4-5 — Enumerate", "title": "Per-service recon, in tiers", "body": "Each module runs safe read-only checks automatically (Tier-1: null session, shares, banners), shows single default-credential checks for you to click (Tier-2), and keeps list-based spraying opt-in and off by default (Tier-3). The flagship action is ranked.", "image": "smb-tool-panel.png", "caption": "SMB recon — Tier-1 auto, Tier-2 manual follow-ups"}, {"kind": "image", "eyebrow": "Web", "title": "Content discovery, by dropdown", "body": "The HTTP builder reproduces a full feroxbuster/ffuf/gobuster command from controls — wordlist, extension presets, threads, depth, status codes — and switches tools without retyping. Password wordlists are filtered out unless Spray mode is on.", "image": "http-panel.png", "caption": "HTTP content-discovery builder"}, {"kind": "image", "eyebrow": "Step 6 — Analyze", "title": "Findings, framed conservatively", "body": "Everything parsed lands in one searchable, filterable view. Crucially, an open port, a version, or an Exploit-DB match is never called a vulnerability — only real weak postures (anonymous access, null session, SMB signing disabled) are flagged notable.", "image": "findings.png", "caption": "Findings — colour-coded conservative categories"}, {"kind": "image", "eyebrow": "References", "title": "HackTricks + Exploit-DB, in-pane", "body": "Select a service and the matching HackTricks page loads — bundled offline so it always works, with an optional live copy — and Exploit-DB is looked up by product/version. The pane even jumps to the section your findings point at. Reference only; never run.", "image": "reference-offline.png", "caption": "Reference pane — offline HackTricks + the source badge"}, {"kind": "text", "eyebrow": "Visualize", "title": "The attack-surface graph", "body": "Press Ctrl+G for a BloodHound-style map: target → services → findings → credentials. Notable/weak items are ringed, Exploit-DB references are coloured apart from danger, and credential secrets are never searchable. Drag, drill in, annotate, and export to PNG/SVG.", "bullets": ["Search: type ssh / 445 / admin to highlight + fit", "Double-click a service to collapse its findings", "A legend spells out every colour and the notable ring"]}, {"kind": "image", "eyebrow": "Credentials", "title": "A durable, masked vault", "body": "Collected credentials live in the project (file-permission-locked). The table shows the username, source, and a masked length — never the secret. The plaintext only ever leaves via an explicit Copy, and even that logs the username only.", "image": "credential-vault.png", "caption": "Credential Vault — secrets masked, primary/destructive ranking"}, {"kind": "image", "eyebrow": "Opt-in", "title": "Credential spray — gated", "body": "Password spraying against your own authorized target is OSCP-legal, so it's supported — but off by default. You enable Spray mode, pick the credentials, preview the exact commands, and confirm. Secrets are redacted in the streamed output and on disk.", "image": "spray-dialog.png", "caption": "Credential Spray — explicit, target-scoped, preview-then-run"}, {"kind": "text", "eyebrow": "Safety", "title": "One gate, every command", "body": "Every subprocess — automatic or typed by hand — runs through a single chokepoint that enforces the exam rules. Blocked actions surface as a clear feedback banner while the full stream still lands in the output log.", "bullets": ["No Metasploit / meterpreter, no SQLMap, no commercial scanners", "No brute-force / spraying unless you explicitly turn Spray mode on", "Blocked → “[blocked] credential brute is Spray-mode only (§2a)”", "The default posture is provably recon-only"]}, {"kind": "image", "eyebrow": "Trail", "title": "A complete audit trail", "body": "Every action is recorded to an append-only log — commands, setting changes, reference visits, credential edits (secret redacted). The Activity view reads it back, newest first: a full, exam-ready record of exactly what you did and when.", "image": "activity.png", "caption": "Activity — the append-only audit trail"}, {"kind": "text", "eyebrow": "Step 7 — Present", "title": "An Obsidian-ready report", "body": "Everything becomes a single markdown report with YAML front-matter, per-service findings, suggested next steps with their sources, and the full command log with timings and exit codes. Drop it into your vault and the write-up is half done.", "bullets": ["Open ports at a glance (TCP + UDP)", "Findings + references + suggestions, cited", "Every command shown with full args — nothing hidden", "Also exports as a linked Obsidian vault folder"]}, {"kind": "split", "eyebrow": "Comfort", "title": "Light & dark, your call", "body": "The whole workspace is theme-aware — pick what's easy on the eyes at 2 a.m. Colour is always paired with text, so state never depends on colour alone.", "image": "shell-light.png", "image2": "shell-dark.png", "caption": "The same shell, both themes"}, {"kind": "text", "eyebrow": "Why it's safe to demo", "title": "Recon-first, by design", "body": "Nabu is built to be run during the exam, not just prep — so the guardrails are the product, not an afterthought.", "bullets": ["Recon-only default · exploitation is out of scope entirely", "Runs offline · no telemetry, no login, no AI at runtime", "Credentials durable + masked; spraying opt-in and target-scoped", "Every screenshot here is synthetic demo data — no real host or secret"]}, {"kind": "title", "title": "A complete recon workspace", "eyebrow": "That's the tour", "body": "From the moment you enter an IP to the finished report — discovery, enumeration, findings, references, graph, and write-up, in one calm, exam-legal desktop tool.", "bullets": ["Explore the interactive flow: docs/how-nabu-works.html", "Every stage is user-driven — nothing runs itself"]}];
const slide=document.getElementById('slide');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function bullets(b){return b&&b.length?('<ul>'+b.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'):'';}
function render(){
 const s=SLIDES[i];
 let html='';
 const head=(s.eyebrow?'<p class="eyebrow">'+esc(s.eyebrow)+'</p>':'')+(s.title?'<h1>'+esc(s.title)+'</h1>':'')
   +(s.body?'<p class="lead">'+esc(s.body)+'</p>':'');
 if(s.kind==='title'){slide.innerHTML='<div class="title-slide">'+head+bullets(s.bullets)+'</div>';}
 else if(s.kind==='text'){slide.innerHTML='<div>'+head+bullets(s.bullets)+'</div>';}
 else if(s.kind==='split'){
  html='<div class="imgwrap split"><div>'+head+'</div><figure><div class="two">'
   +'<img src="'+IMAGES[s.image]+'" alt=""><img src="'+IMAGES[s.image2]+'" alt="">'
   +'</div><figcaption>'+esc(s.caption||'')+'</figcaption></figure></div>';
  slide.innerHTML=html;
 } else {
  html='<div class="imgwrap"><div>'+head+bullets(s.bullets)+'</div>'
   +'<figure><img src="'+IMAGES[s.image]+'" alt=""><figcaption>'+esc(s.caption||'')+'</figcaption></figure></div>';
  slide.innerHTML=html;
 }
 count.textContent=(i+1)+' / '+SLIDES.length;
 [...dots.children].forEach((d,n)=>d.setAttribute('aria-current',n===i));
 document.getElementById('prev').disabled=i===0;
 document.getElementById('next').disabled=i===SLIDES.length-1;
}
function go(n){i=Math.max(0,Math.min(SLIDES.length-1,n));render();}
SLIDES.forEach((_,n)=>{const b=document.createElement('button');b.className='dot';b.type='button';
 b.setAttribute('aria-label','Slide '+(n+1));b.onclick=()=>go(n);dots.appendChild(b);});
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1);}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
 else if(e.key==='Home'){go(0);}else if(e.key==='End'){go(SLIDES.length-1);}
});
const root=document.documentElement;
document.getElementById('theme').onclick=()=>{
 const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 root.setAttribute('data-theme',cur==='dark'?'light':'dark');
};
render();
</script>
